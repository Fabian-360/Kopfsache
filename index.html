<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kopfsache">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0C0C0E">
<title>Kopfsache – Lern-App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C0C0E; --card:#17171A; --card2:#1F1F23; --ink:#F6F4F1; --muted:#9B9AA3; --line:#2C2C32;
  --ok:#2FBF71; --okbg:rgba(47,191,113,.14); --bad:#FF4545; --badbg:rgba(255,69,69,.14); --open:#3A3A41;
  --acc:#E10600; --accsoft:rgba(225,6,0,.16);
  --r:24px; --shadow:inset 0 1px 0 rgba(255,255,255,.04),0 10px 30px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overscroll-behavior:none;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:18px;line-height:1.55}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque",Nunito,sans-serif;letter-spacing:-.02em;margin:0}
.wrap{max-width:880px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(80px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left))}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px;min-height:44px}
.back{display:inline-flex;align-items:center;gap:6px;padding:10px 16px 10px 12px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:16px}
.back:active{transform:scale(.97)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--card);font-weight:700;font-size:14px;color:var(--muted);box-shadow:var(--shadow)}
.note{background:rgba(225,6,0,.15);border-radius:14px;padding:10px 14px;font-size:15px;margin-bottom:16px}

/* Welcome */
.welcome{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;position:relative;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;z-index:0}
.welcome>*:not(.blob){position:relative;z-index:1;flex-shrink:0}
.logo{width:clamp(64px,12vh,110px);height:clamp(64px,12vh,110px);font-size:clamp(34px,6.5vh,56px) !important;border-radius:30%;background:#08080A;display:grid;place-items:center;overflow:hidden;transform:rotate(-6deg);box-shadow:0 18px 50px rgba(225,6,0,.35);border:1px solid rgba(255,255,255,.08);margin-bottom:clamp(14px,3vh,28px);animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:rotate(-2deg) translateY(-6px)}}
.logo img{width:100%;height:100%;display:block}
.hello{font-weight:800;color:var(--muted);font-size:20px;margin:0 0 6px}
.welcome h1{font-size:clamp(44px,min(10vw,9vh),92px);font-weight:800;line-height:.95}
.welcome .sub{color:var(--muted);font-size:clamp(15px,2.2vh,19px);max-width:440px;margin:clamp(8px,2vh,18px) auto clamp(14px,3vh,30px)}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:clamp(16px,3.5vh,34px)}
.chip{background:var(--card);border-radius:16px;padding:clamp(8px,1.4vh,12px) 18px;box-shadow:var(--shadow);text-align:left}
.chip b{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:26px;line-height:1.1}
.chip span{font-size:14px;color:var(--muted);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--acc);color:#fff;font-weight:800;padding:16px 28px;border-radius:18px;font-size:18px;min-height:56px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.big{font-size:21px;padding:20px 44px;border-radius:22px}
.btn.acc{background:var(--acc)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btnrow{display:flex;gap:12px;flex-wrap:wrap}

/* Home */
.h-title{font-size:40px;font-weight:800;margin:6px 0 4px}
.h-sub{color:var(--muted);margin:0 0 26px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.mcard{background:var(--card);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;transition:transform .15s}
.mcard:active{transform:scale(.98)}
.mcard::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--acc)}
.memo{width:56px;height:56px;border-radius:18px;background:var(--accsoft);display:grid;place-items:center;font-size:30px}
.mcard h2{font-size:24px;font-weight:700}
.mcard p{margin:0;color:var(--muted);font-size:15px;line-height:1.4}
.meta{display:flex;gap:14px;font-size:14px;font-weight:700;color:var(--muted)}
.bar{height:10px;border-radius:99px;background:#2A2A30;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.empty{background:var(--card);border:2px dashed var(--line);border-radius:var(--r);padding:34px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:20px;margin-bottom:6px}

/* Module */
.hero{background:var(--acc);color:#fff;border-radius:30px;padding:30px;display:flex;gap:20px;align-items:center;margin-bottom:22px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.12);right:-70px;top:-90px}
.hero .memo{background:rgba(255,255,255,.2);width:72px;height:72px;font-size:40px;border-radius:22px;flex:none}
.hero h1{font-size:36px;font-weight:800;line-height:1.05}
.hero p{margin:6px 0 0;opacity:.85;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:640px){.tiles{grid-template-columns:1fr}}
.tile{background:var(--card);border-radius:var(--r);padding:24px 22px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:6px;min-height:190px;transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile .ic{font-size:38px;margin-bottom:auto}
.tile h3{font-size:24px;font-weight:700}
.tile span{color:var(--muted);font-weight:700;font-size:15px}
.hist{background:var(--card);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);margin-top:18px}
.hist h3{font-size:18px;margin-bottom:14px}
.hbars{display:flex;align-items:flex-end;gap:10px;height:110px}
.hb{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;max-width:70px}
.hb i{width:100%;border-radius:10px 10px 4px 4px;background:var(--acc);min-height:4px}
.hb i.low{background:#55555D}
.hb small{font-weight:800;font-size:13px;color:var(--muted)}

/* Lists */
.list{display:flex;flex-direction:column;gap:12px}
.row{background:var(--card);border-radius:20px;padding:18px 20px;box-shadow:var(--shadow);display:flex;align-items:center;gap:16px;text-align:left;width:100%;transition:transform .12s}
.row:active{transform:scale(.99)}
.num{width:44px;height:44px;border-radius:14px;background:var(--accsoft);color:var(--acc);display:grid;place-items:center;font-weight:800;font-family:"Bricolage Grotesque",system-ui,sans-serif;flex:none}
.num.done{background:var(--okbg);color:var(--ok)}
.row .t{flex:1;font-weight:700}
.row .t small{display:block;color:var(--muted);font-weight:600;font-size:14px}

/* Lesson */
.article{background:var(--card);border-radius:28px;padding:34px clamp(22px,5vw,48px);box-shadow:var(--shadow);font-size:19px;line-height:1.7}
.article h1{font-size:34px;font-weight:800;margin-bottom:18px;line-height:1.1}
.article h3{font-size:23px;margin:28px 0 8px}
.article p{margin:0 0 14px}
.article ul{margin:0 0 16px;padding-left:24px}
.article li{margin-bottom:6px}
.article code{background:#2A2A30;padding:2px 6px;border-radius:6px;font-size:.9em}
.merke{background:var(--accsoft);border-left:5px solid var(--acc);border-radius:14px;padding:14px 18px;margin:18px 0;font-weight:600}
.sect{display:flex;align-items:center;gap:12px;margin:36px 0 16px}
.sect h2{font-size:26px;font-weight:800}

/* Question */
.qcard{background:var(--card);border-radius:28px;padding:28px;box-shadow:var(--shadow);margin-bottom:18px}
.qhead{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--acc);margin-bottom:8px}
.qtext{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:clamp(23px,3.4vw,29px);font-weight:700;line-height:1.25;margin-bottom:22px}
.qtext .not{background:var(--badbg);color:var(--bad);padding:0 6px;border-radius:6px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:16px 18px;border-radius:18px;border:2px solid var(--line);background:var(--card2);font-weight:700;font-size:18px;min-height:64px;transition:transform .1s,border-color .15s,background .15s}
.opt:active{transform:scale(.99)}
.opt .l{width:36px;height:36px;border-radius:11px;background:#2C2C32;display:grid;place-items:center;font-weight:800;flex:none;font-family:"Bricolage Grotesque"}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg);animation:shake .35s}
.opt.bad .l{background:var(--bad);color:#fff}
.opt.dim{opacity:.45}
.opts.locked .opt{pointer-events:none}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:18px;border-radius:18px;padding:16px 18px;font-size:17px}
.fb.ok{background:var(--okbg)}
.fb.bad{background:var(--badbg)}
.fb b{display:block;font-size:19px;margin-bottom:2px}
.prog{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.prog .bar{flex:1;height:12px}
.prog .bar i{background:var(--acc);transition:width .4s}
.prog b{font-weight:800;min-width:64px;text-align:right}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--open)}
.dots i.ok{background:var(--ok)} .dots i.bad{background:var(--bad)} .dots i.cur{outline:3px solid var(--acc);outline-offset:2px}
.sticky{position:sticky;bottom:16px;display:flex;justify-content:flex-end;margin-top:18px}

/* Result */
.result{text-align:center;padding-top:10px}
.ringwrap{position:relative;width:220px;height:220px;margin:10px auto 18px}
.ringwrap .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:58px;font-weight:800}
.result h1{font-size:34px;font-weight:800}
.result .sub{color:var(--muted);font-weight:600;margin:6px 0 26px}
.badge{display:inline-block;padding:6px 14px;border-radius:999px;font-weight:800;font-size:15px;margin-bottom:12px}
.badge.ok{background:var(--okbg);color:var(--ok)} .badge.bad{background:var(--badbg);color:var(--bad)}
.wronglist{text-align:left;margin-top:30px}
.wl{background:var(--card);border-radius:18px;padding:16px 20px;box-shadow:var(--shadow);margin-bottom:10px}
.wl .q{font-weight:700;margin-bottom:6px}
.wl .a{color:var(--ok);font-weight:700;font-size:16px}
.wl .y{color:var(--bad);font-weight:600;font-size:15px;text-decoration:line-through}

/* Workbook */
.wbtop{background:var(--card);border-radius:28px;padding:26px;box-shadow:var(--shadow);margin-bottom:18px}
.wbtop .bar{height:22px;border-radius:12px;margin:16px 0 20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{border-radius:18px;padding:16px;text-align:left}
.stat b{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:36px;line-height:1}
.stat span{font-weight:700;font-size:15px}
.stat small{display:block;opacity:.7;font-weight:700;font-size:13px;margin-top:2px}
.s-open{background:#232328} .s-ok{background:var(--okbg);color:var(--ok)} .s-bad{background:var(--badbg);color:var(--bad)}
.filters{display:flex;gap:8px;margin:20px 0 14px;flex-wrap:wrap}
.f{padding:10px 18px;border-radius:999px;background:var(--card);font-weight:800;font-size:15px;box-shadow:var(--shadow)}
.f.on{background:var(--acc);color:#fff}
.qrow{background:var(--card);border-radius:16px;padding:14px 18px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);margin-bottom:8px}
.qrow .d{width:14px;height:14px;border-radius:50%;background:var(--open);flex:none}
.qrow .d.ok{background:var(--ok)} .qrow .d.bad{background:var(--bad)}
.qrow .t{flex:1;font-weight:600;font-size:16px}
.qrow small{color:var(--muted);font-weight:700;font-size:13px;white-space:nowrap}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
:root{--gold:#FFC83D}
.setcard{background:var(--card);border-radius:var(--r);padding:24px;box-shadow:var(--shadow);margin-bottom:16px}
.setcard h3{font-size:22px;margin-bottom:6px}
.setcard p{color:var(--muted);font-weight:600;margin:0 0 16px}
.welcome{padding-top:calc(16px + env(safe-area-inset-top));padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.stacksec{background:var(--card);border-radius:var(--r);padding:22px 22px 18px;box-shadow:var(--shadow);margin-top:18px}
.stacksec h3{font-size:20px;margin-bottom:4px}
.stacksec>p{margin:0 0 6px;color:var(--muted);font-weight:600;font-size:15px}
.stacks{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,3vw,26px)}
.stack{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:8px}
.stack:active .pile{transform:scale(.97)}
.pile{position:relative;width:100%;max-width:190px;height:178px;transition:transform .15s}
.card{position:absolute;left:6%;right:6%;height:112px;border-radius:16px;border:1px solid rgba(255,255,255,.08);transition:bottom .5s cubic-bezier(.2,.8,.2,1)}
.card.top{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;box-shadow:0 10px 24px rgba(0,0,0,.45)}
.card.top b{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:42px;line-height:1}
.card.top span{font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.card.empty{border:2px dashed var(--line);background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.st-open .card{background:#26262C} .st-open .card.top{background:linear-gradient(160deg,#4A4A53,#2E2E35)}
.st-ok .card{background:#123A27} .st-ok .card.top{background:linear-gradient(160deg,#2FBF71,#17844C)}
.st-bad .card{background:#4A0606} .st-bad .card.top{background:linear-gradient(160deg,#FF2A1F,#A80400)}
.stack .lbl{font-weight:800;font-size:16px}
.stack .lbl small{display:block;text-align:center;color:var(--muted);font-weight:700;font-size:13px}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:18px}
.kcard{background:var(--card);border-radius:18px;padding:18px;box-shadow:var(--shadow);border-top:5px solid var(--open);font-weight:600;font-size:16px;display:flex;flex-direction:column;gap:10px}
.kcard.ok{border-top-color:var(--ok)} .kcard.bad{border-top-color:var(--bad)}
.kcard small{color:var(--muted);font-weight:700;font-size:13px}
.gamebar{width:100%;display:flex;align-items:center;gap:16px;text-align:left;padding:20px 22px;margin-bottom:22px;border-radius:var(--r);background:linear-gradient(120deg,#E10600,#7A0000);color:#fff;box-shadow:0 14px 40px rgba(225,6,0,.3);transition:transform .15s}
.gamebar:active{transform:scale(.98)}
.gamebar .gi{font-size:40px}
.gamebar .gt{flex:1;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:26px;font-weight:800;line-height:1.1}
.gamebar .gt small{display:block;font-family:Nunito,system-ui,sans-serif;font-size:15px;font-weight:700;opacity:.8}
.gamebar .gc{background:rgba(0,0,0,.35);padding:10px 16px;border-radius:999px;font-weight:800;font-size:18px;color:var(--gold)}
.soon{text-align:center;background:var(--card);border-radius:28px;padding:48px 28px;box-shadow:var(--shadow)}
.soon .big{font-size:72px;margin-bottom:10px}
.soon h1{font-size:32px;font-weight:800}
.soon p{color:var(--muted);font-weight:600;max-width:420px;margin:10px auto 22px}
.coinbig{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:48px;font-weight:800;color:var(--gold);margin-bottom:24px}
.coins{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-weight:800;font-size:15px}
.coins b{color:var(--gold)}
.run{display:inline-flex;gap:3px}
.run i{width:8px;height:8px;border-radius:50%;background:var(--open)}
.run i.on{background:var(--gold)}
.dots i.coin{background:var(--gold)}
.coinbtn{margin-top:14px;display:flex;align-items:center;gap:10px;width:100%;justify-content:center;padding:16px;border-radius:18px;border:2px dashed var(--gold);color:var(--gold);font-weight:800;font-size:18px;background:rgba(255,200,61,.08)}
.coinbtn:active{transform:scale(.98)}
.fb.coin{background:rgba(255,200,61,.12)}
.tag{display:inline-block;font-size:13px;font-weight:800;color:var(--gold);margin-left:6px}
.toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:60;background:var(--card);border:2px solid var(--gold);color:var(--ink);padding:16px 26px;border-radius:22px;font-weight:800;font-size:22px;display:flex;align-items:center;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.5);animation:pop 1.9s ease forwards;pointer-events:none}
.toast .c{font-size:40px;animation:spin .8s ease}
@keyframes pop{0%{opacity:0;transform:translate(-50%,20px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.05)}25%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
@keyframes spin{from{transform:rotateY(0)}to{transform:rotateY(720deg)}}
</style>
</head>
<body>
<div id="app"></div>
<canvas id="confetti"></canvas>
<script>
(function(){
"use strict";
const app = document.getElementById('app');
const LS_P = 'kopfsache.progress.v1', LS_M = 'kopfsache.modules.v1';
const NAME = 'Fabian';

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rand = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick = (a,n) => shuffle(a).slice(0,n);
const fmtDay = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
const clone = o => JSON.parse(JSON.stringify(o));

function md(t){
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>');
  let html='', list=false, para=[];
  const flushP=()=>{ if(para.length){ html+='<p>'+inline(para.join(' '))+'</p>'; para=[]; } };
  const closeL=()=>{ if(list){ html+='</ul>'; list=false; } };
  for (const raw of String(t||'').split('\n')){
    const l = raw.trim();
    if (!l){ flushP(); closeL(); continue; }
    if (l.startsWith('## ')){ flushP(); closeL(); html+='<h3>'+inline(l.slice(3))+'</h3>'; continue; }
    if (l.startsWith('> ')){ flushP(); closeL(); html+='<div class="merke">'+inline(l.slice(2))+'</div>'; continue; }
    if (/^[-•] /.test(l)){ flushP(); if(!list){ html+='<ul>'; list=true; } html+='<li>'+inline(l.slice(2))+'</li>'; continue; }
    closeL(); para.push(l);
  }
  flushP(); closeL(); return html;
}

/* ---------- state ---------- */
let P = normP(lsGet(LS_P));
let S = { view:'welcome', modules: (lsGet(LS_M)||[]), contentDate: lsGet(LS_M+'.date')||'', modId:null, lessonId:null, lq:[], test:null, filter:'all', note:null, confirmQuit:false };
function normP(p){ p = p && typeof p==='object' ? p : {}; return { q:p.q||{}, lessons:p.lessons||{}, tests:Array.isArray(p.tests)?p.tests:[], days:p.days||{}, coins:+p.coins||0, run:+p.run||0, ct:+p.ct||0 }; }

const mod = () => S.modules.find(m => m.id===S.modId);
const key = (m,q) => m.id+'::'+q.id;
const status = (m,q) => (P.q[key(m,q)]||{}).last;
function stats(m){
  const qs = m.questions||[]; let ok=0, bad=0;
  qs.forEach(q => { const s=status(m,q); if(s==='r') ok++; else if(s==='w') bad++; });
  const n = qs.length, open = n-ok-bad;
  const pc = x => n ? Math.round(x/n*100) : 0;
  return { n, ok, bad, open, pOk:pc(ok), pBad:pc(bad), pOpen: n ? 100-pc(ok)-pc(bad) : 0 };
}
function record(m,q,ok){
  const k = key(m,q), e = P.q[k] || {r:0,w:0};
  if (ok) e.r++; else e.w++;
  e.last = ok ? 'r' : 'w'; e.t = Date.now();
  P.q[k] = e;
  const d = fmtDay(new Date()); P.days[d] = (P.days[d]||0)+1;
  if (ok){ P.run++; if (P.run>=3){ P.coins++; P.run=0; S.toast='<span class="c">🪙</span> +1 Münze!'; } } else P.run = 0;
  P.ct = Date.now();
  save();
}
function streak(){
  const d = new Date(); if (!P.days[fmtDay(d)]) d.setDate(d.getDate()-1);
  let n=0; while (P.days[fmtDay(d)]){ n++; d.setDate(d.getDate()-1); } return n;
}

/* ---------- question building (anti-auswendig) ---------- */
function buildQ(q){
  const corr = q.correct||[], wr = q.wrong||[];
  const inverse = Array.isArray(q.notPrompts) && q.notPrompts.length && corr.length>=3 && wr.length && Math.random()<0.3;
  let prompt, answer, others;
  if (inverse){ prompt = rand(q.notPrompts); answer = rand(wr); others = pick(corr,3); }
  else { prompt = rand(q.prompts && q.prompts.length ? q.prompts : ['?']); answer = rand(corr); others = pick(wr,3); }
  const options = shuffle([answer, ...others]);
  return { prompt, options, answer: options.indexOf(answer), inverse:!!inverse, explain: q.explain||'' };
}
function selectQs(m, mode, n){
  n = n || 10;
  const qs = m.questions||[], st = q => status(m,q);
  if (mode==='wrong') return shuffle(qs.filter(q => st(q)==='w')).slice(0,n);
  if (mode==='open')  return shuffle(qs.filter(q => !st(q))).slice(0,n);
  if (mode==='right') return shuffle(qs.filter(q => st(q)==='r')).slice(0,n);
  const wrong = shuffle(qs.filter(q => st(q)==='w'));
  const open  = shuffle(qs.filter(q => !st(q)));
  const right = qs.filter(q => st(q)==='r')
    .map(q => ({q, t:(P.q[key(m,q)].t||0) + Math.random()*36e5*12}))
    .sort((a,b) => a.t-b.t).map(x => x.q);
  const want = Math.min(wrong.length, Math.ceil(n*0.4));
  const out = wrong.slice(0,want);
  for (const arr of [open, right, wrong.slice(want)]) for (const q of arr){ if (out.length>=n) break; out.push(q); }
  return shuffle(out);
}
function promptHtml(b){
  let p = esc(b.prompt);
  if (b.inverse) p = p.replace(/\b(NICHT|FALSCH|KEIN|KEINE)\b/g,'<span class="not">$1</span>');
  return p;
}

/* ---------- persistence ---------- */
let db=null, progRef=null, saveTimer=null, chain=Promise.resolve();
function save(){
  lsSet(LS_P, P);
  if (!progRef) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const body = clone(P);
    chain = chain.then(() => progRef.set(body)).catch(e => console.warn('save', e));
  }, 1200);
}
function mergeP(a, b){
  const out = normP(clone(a)); b = normP(b);
  for (const k in b.q){ if (!out.q[k] || (b.q[k].t||0) > (out.q[k].t||0)) out.q[k] = b.q[k]; }
  Object.assign(out.lessons, b.lessons);
  const seen = new Set(out.tests.map(t => t.t));
  b.tests.forEach(t => { if (!seen.has(t.t)) out.tests.push(t); });
  out.tests.sort((x,y) => x.t-y.t); out.tests = out.tests.slice(-150);
  for (const d in b.days) out.days[d] = Math.max(out.days[d]||0, b.days[d]);
  if ((b.ct||0) > (out.ct||0)){ out.coins=b.coins; out.run=b.run; out.ct=b.ct; }
  return out;
}
function sortMods(list){ return list.slice().sort((a,b) => (a.order??99)-(b.order??99) || String(a.title).localeCompare(String(b.title))); }

async function init(){
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  if ('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const w = reg.installing; if (!w) return;
        w.addEventListener('statechange', () => { if (w.state==='installed' && navigator.serviceWorker.controller) S.updateReady = true; });
      });
    }).catch(() => {});
  }
  try {
    const r = await fetch('content.json', { cache:'no-cache' });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    const mods = sortMods((j.modules||[]).filter(m => m && m.id));
    const count = list => list.reduce((a,m) => a + (m.questions||[]).length + (m.lessons||[]).length, 0);
    const before = S.modules.length ? count(S.modules) : null;
    const changed = JSON.stringify(mods) !== JSON.stringify(S.modules);
    S.modules = mods; S.contentDate = j.updated || ''; lsSet(LS_M, mods); lsSet(LS_M+'.date', S.contentDate);
    if (changed){
      if (before !== null && count(mods) > before) S.toast = '<span class="c">📚</span> Neuer Stoff da!';
      if (!S.test) render();
    }
  } catch(e){
    if (!S.modules.length){ S.note = 'Du bist offline und es ist noch kein Stoff gespeichert. Öffne die App einmal mit Internet.'; render(); }
  }
}

const STACKS = { open:['Unbeantwortet','st-open'], ok:['Richtig','st-ok'], bad:['Falsch','st-bad'] };
function stacksHtml(m){
  const st = stats(m), n = st.n || 1;
  const one = (k, count, pct) => {
    const L = count ? Math.min(9, Math.max(1, Math.ceil(count/n*9))) : 0;
    let cards = '';
    for (let i=0;i<L;i++){
      const top = i===L-1, rot = top ? 0 : ((i%2?1:-1)*(1+i%3));
      cards += `<div class="card ${top?'top':''}" style="bottom:${i*7}px;transform:rotate(${rot}deg)">${top?`<b>${count}</b><span>${STACKS[k][0]}</span>`:''}</div>`;
    }
    if (!L) cards = `<div class="card empty" style="bottom:0">leer</div>`;
    return `<button class="stack ${STACKS[k][1]}" data-act="stack" data-k="${k}"><div class="pile">${cards}</div><div class="lbl">${STACKS[k][0]}<small>${pct} %</small></div></button>`;
  };
  return `<div class="stacks">${one('open',st.open,st.pOpen)}${one('ok',st.ok,st.pOk)}${one('bad',st.bad,st.pBad)}</div>`;
}

function vStack(){
  const m = mod(); if (!m) return vHome();
  const k = S.stack, want = k==='ok' ? 'r' : k==='bad' ? 'w' : undefined;
  const qs = (m.questions||[]).filter(q => status(m,q)===want);
  const mode = k==='ok' ? 'right' : k==='bad' ? 'wrong' : 'open';
  const lessonTitle = id => ((m.lessons||[]).find(l => l.id===id)||{}).title || '';
  return `<div class="wrap fade">
    <div class="top">${backBtn('openMod', m.title, ` data-id="${esc(m.id)}"`)}<span class="spacer"></span>${coinPill()}</div>
    <h1 class="h-title">${k==='bad'?'❌':k==='ok'?'✅':'🃏'} ${STACKS[k][0]}</h1>
    <p class="h-sub">${qs.length} ${qs.length===1?'Karte':'Karten'} in diesem Stapel</p>
    <button class="btn big" data-act="test" data-mode="${mode}" ${qs.length?'':'disabled'}>${k==='bad'?'Falsche üben':k==='ok'?'Richtige wiederholen':'Unbeantwortete üben'} (${Math.min(10,qs.length)}) →</button>
    ${qs.length ? `<div class="cardgrid">${qs.map(q => { const e = P.q[key(m,q)];
      return `<div class="kcard ${k}">${esc((q.prompts||[])[0]||'')}<small>${e ? `✓ ${e.r}× richtig · ✗ ${e.w}× falsch` : esc(lessonTitle(q.lesson))}</small></div>`; }).join('')}</div>`
      : `<div class="empty" style="margin-top:18px">Dieser Stapel ist gerade leer.</div>`}
  </div>`;
}

function vSettings(){
  const nq = Object.keys(P.q).length;
  return `<div class="wrap fade">
    <div class="top">${backBtn('home','Module')}</div>
    <h1 class="h-title">⚙️ Einstellungen</h1>
    <p class="h-sub">Dein Fortschritt ist auf diesem iPad gespeichert.</p>
    <div class="setcard">
      <h3>💾 Backup</h3>
      <p>Sichere ab und zu deinen Fortschritt (${nq} beantwortete Fragen, 🪙 ${P.coins} Münzen) – z.&nbsp;B. in der Dateien-App oder iCloud. Falls du die App mal löschst, kannst du ihn so zurückholen.</p>
      <div class="btnrow">
        <button class="btn" data-act="backup">Backup speichern</button>
        <label class="btn ghost">Backup laden<input type="file" accept="application/json,.json" id="restore" hidden></label>
      </div>
    </div>
    <div class="setcard">
      <h3>📚 Stoff</h3>
      <p>${S.modules.length} Module · Stand ${esc(S.contentDate||'unbekannt')}. Neuer Stoff lädt automatisch, sobald du die App mit Internet öffnest.</p>
      <button class="btn ghost" data-act="reload">Jetzt nach neuem Stoff suchen</button>
    </div>
  </div>`;
}

function vGame(){
  const m = S.gameMod && S.modules.find(x => x.id===S.gameMod);
  if (m) return `<div class="wrap fade">
    <div class="top">${backBtn('game','Modulwahl')}<span class="spacer"></span>${coinPill()}</div>
    <div class="soon"><div class="big">🎮</div><h1>${esc(m.emoji||'')} ${esc(m.title)}</h1>
      <p>Hier kommt bald das Spiel hin. Deine Münzen sind schon gesammelt und warten auf dich.</p>
      <div class="coinbig">🪙 ${P.coins}</div>
      <button class="btn ghost" data-act="home">Zurück zu den Modulen</button></div>
  </div>`;
  return `<div class="wrap fade">
    <div class="top">${backBtn('home','Module')}<span class="spacer"></span>${coinPill()}</div>
    <h1 class="h-title">🎮 Spiel</h1>
    <p class="h-sub">Welches Modul willst du spielen?</p>
    ${S.modules.length ? `<div class="list">${S.modules.map(x => `<button class="row" data-act="gamePick" data-id="${esc(x.id)}"><span class="num">${esc(x.emoji||'📘')}</span><span class="t">${esc(x.title)}<small>${(x.questions||[]).length} Fragen</small></span><span>›</span></button>`).join('')}</div>` : `<div class="empty"><b>Noch keine Module da</b></div>`}
  </div>`;
}

function render(){
  const v = { settings:vSettings, stack:vStack, game:vGame, welcome:vWelcome, home:vHome, module:vModule, learn:vLearn, lesson:vLesson, test:vTest, result:vResult, wb:vWorkbook }[S.view] || vHome;
  app.innerHTML = v();
  if (S.toast){ const html = S.toast; S.toast = false; const t = document.createElement('div'); t.className='toast'; t.innerHTML=html; document.body.appendChild(t); setTimeout(() => t.remove(), 2000); }
  const arc = app.querySelector('.ringarc');
  if (arc) requestAnimationFrame(() => requestAnimationFrame(() => { arc.style.strokeDashoffset = arc.dataset.off; }));
}
function go(view){ S.view = view; S.confirmQuit = false; render(); window.scrollTo(0,0); }

/* ---------- actions ---------- */
function startTest(mode){
  const m = mod(); if (!m) return;
  const qs = selectQs(m, mode, 10); if (!qs.length) return;
  S.test = { modId:m.id, mode, items: qs.map(q => ({ qid:q.id, b:buildQ(q), chosen:null })), idx:0, saved:false };
  go('test');
}
const A = {
  welcome: () => go('welcome'),
  home: () => { S.test = null; go('home'); },
  openMod: d => { S.modId = d.id; S.test = null; go('module'); },
  learn: () => go('learn'),
  lesson: d => { S.lessonId = d.id; newLessonQs(); go('lesson'); },
  moreLq: () => { newLessonQs(); render(); },
  lAns: d => {
    const it = S.lq[+d.i]; if (!it || it.chosen!==null) return;
    it.chosen = +d.j; const m = mod(), q = (m.questions||[]).find(x => x.id===it.qid);
    if (q) record(m, q, it.chosen===it.b.answer);
    render();
  },
  markRead: () => { const m = mod(); P.lessons[m.id+'::'+S.lessonId] = Date.now(); save(); go('learn'); },
  test: d => startTest(d.mode||'mix'),
  tAns: d => {
    const T = S.test, it = T && T.items[+d.i]; if (!it || it.chosen!==null) return;
    it.chosen = +d.j; const m = S.modules.find(x => x.id===T.modId), q = (m.questions||[]).find(x => x.id===it.qid);
    if (q) record(m, q, it.chosen===it.b.answer);
    render();
  },
  next: () => {
    const T = S.test; if (!T) return;
    if (T.idx+1 < T.items.length){ T.idx++; S.confirmQuit=false; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
    const r = T.items.filter(isRight).length, p = Math.round(r/T.items.length*100);
    if (!T.saved){ P.tests.push({ m:T.modId, mode:T.mode, p, r, n:T.items.length, t:Date.now() }); P.tests = P.tests.slice(-150); T.saved = true; save(); }
    go('result');
    if (p>=80) confetti();
  },
  settings: () => go('settings'),
  reload: () => { location.reload(); },
  backup: async () => {
    const name = 'kopfsache-backup-' + fmtDay(new Date()) + '.json';
    const blob = new Blob([JSON.stringify(P)], { type:'application/json' });
    try {
      const file = new File([blob], name, { type:'application/json' });
      if (navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], title:'Kopfsache Backup' }); return; }
    } catch(e){ if (e && e.name==='AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  },
  stack: d => { S.stack = d.k; go('stack'); },
  game: () => { S.gameMod = null; S.test = null; go('game'); },
  gamePick: d => { S.gameMod = d.id; go('game'); },
  quit: () => { S.confirmQuit = true; render(); },
  quitNo: () => { S.confirmQuit = false; render(); },
  quitYes: () => { S.test = null; go('module'); },
  wb: () => { S.filter = 'all'; go('wb'); },
  filter: d => { S.filter = d.f; render(); },
};
app.addEventListener('change', e => {
  if (e.target.id !== 'restore' || !e.target.files[0]) return;
  const fr = new FileReader();
  fr.onload = () => {
    try { const data = JSON.parse(fr.result); if (!data || typeof data.q !== 'object') throw 0;
      P = mergeP(normP(data), P); save(); S.toast = '<span class="c">✅</span> Backup geladen!'; render();
    } catch(err){ S.toast = '<span class="c">⚠️</span> Datei ist kein Backup'; render(); }
  };
  fr.readAsText(e.target.files[0]);
});
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = A[el.dataset.act]; if (f) f(el.dataset);
});

/* ---------- confetti ---------- */
function confetti(){
  const c = document.getElementById('confetti'), x = c.getContext('2d');
  c.width = innerWidth*devicePixelRatio; c.height = innerHeight*devicePixelRatio; x.scale(devicePixelRatio, devicePixelRatio);
  const cols = ['#E10600','#FFFFFF','#FF4545','#7A0000','#2FBF71'];
  const ps = Array.from({length:140}, () => ({ x:innerWidth/2 + (Math.random()-.5)*200, y:innerHeight*0.35, vx:(Math.random()-.5)*14, vy:-Math.random()*14-4, s:6+Math.random()*7, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:rand(cols) }));
  const t0 = performance.now();
  (function frame(t){
    x.clearRect(0,0,innerWidth,innerHeight);
    ps.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); x.restore(); });
    if (t - t0 < 3200) requestAnimationFrame(frame); else x.clearRect(0,0,innerWidth,innerHeight);
  })(t0);
}

render();
init();
})();
</script>
</body>
