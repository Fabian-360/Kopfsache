<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kopfsache">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="apple-touch-icon" href="touch-icon-2.png">
<link rel="icon" href="app-icon-192-2.png">
<meta name="theme-color" content="#0C0C0E">
<meta name="robots" content="noindex, nofollow">
<title>Kopfsache – Lern-App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C0C0E; --card:#17171A; --card2:#1F1F23; --ink:#F6F4F1; --muted:#9B9AA3; --line:#2C2C32;
  --ok:#2FBF71; --okbg:rgba(47,191,113,.14); --bad:#FF4545; --badbg:rgba(255,69,69,.14); --open:#3A3A41;
  --acc:#E10600; --accsoft:rgba(225,6,0,.16);
  --r:24px; --shadow:inset 0 1px 0 rgba(255,255,255,.04),0 10px 30px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overscroll-behavior:none;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:18px;line-height:1.55}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque",Nunito,sans-serif;letter-spacing:-.02em;margin:0}
.wrap{max-width:880px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(80px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left))}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px;min-height:44px}
.back{display:inline-flex;align-items:center;gap:6px;padding:10px 16px 10px 12px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:16px}
.back:active{transform:scale(.97)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--card);font-weight:700;font-size:14px;color:var(--muted);box-shadow:var(--shadow)}
.note{background:rgba(225,6,0,.15);border-radius:14px;padding:10px 14px;font-size:15px;margin-bottom:16px}

/* Welcome */
.welcome{position:fixed;inset:0;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;z-index:0}
.welcome>*:not(.blob){position:relative;z-index:1;flex-shrink:0}
.logo{width:clamp(64px,12vh,110px);height:clamp(64px,12vh,110px);font-size:clamp(34px,6.5vh,56px) !important;border-radius:30%;background:var(--acc);display:grid;place-items:center;transform:rotate(-6deg);box-shadow:0 18px 50px rgba(225,6,0,.45);margin-bottom:clamp(14px,3vh,28px);animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:rotate(-2deg) translateY(-6px)}}
.logo img{width:100%;height:100%;display:block}
.welcome h1{margin-bottom:clamp(18px,4vh,36px)}
.hello{font-weight:800;color:var(--muted);font-size:20px;margin:0 0 6px}
.welcome h1{font-size:clamp(44px,min(10vw,9vh),92px);font-weight:800;line-height:.95}
.welcome .sub{color:var(--muted);font-size:clamp(15px,2.2vh,19px);max-width:440px;margin:clamp(8px,2vh,18px) auto clamp(14px,3vh,30px)}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:clamp(16px,3.5vh,34px)}
.chip{background:var(--card);border-radius:16px;padding:clamp(8px,1.4vh,12px) 18px;box-shadow:var(--shadow);text-align:left}
.chip b{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:26px;line-height:1.1}
.chip span{font-size:14px;color:var(--muted);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--acc);color:#fff;font-weight:800;padding:16px 28px;border-radius:18px;font-size:18px;min-height:56px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.big{font-size:21px;padding:20px 44px;border-radius:22px}
.btn.acc{background:var(--acc)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btnrow{display:flex;gap:12px;flex-wrap:wrap}

/* Home */
.h-title{font-size:40px;font-weight:800;margin:6px 0 4px}
.h-sub{color:var(--muted);margin:0 0 26px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.mcard{background:var(--card);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;transition:transform .15s}
.mcard:active{transform:scale(.98)}
.mcard::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--acc)}
.memo{width:56px;height:56px;border-radius:18px;background:var(--accsoft);display:grid;place-items:center;font-size:30px}
.mcard h2{font-size:24px;font-weight:700}
.mcard p{margin:0;color:var(--muted);font-size:15px;line-height:1.4}
.meta{display:flex;gap:14px;font-size:14px;font-weight:700;color:var(--muted)}
.bar{height:10px;border-radius:99px;background:#2A2A30;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.empty{background:var(--card);border:2px dashed var(--line);border-radius:var(--r);padding:34px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:20px;margin-bottom:6px}

/* Module */
.hero{background:var(--acc);color:#fff;border-radius:30px;padding:30px;display:flex;gap:20px;align-items:center;margin-bottom:22px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.12);right:-70px;top:-90px}
.hero .memo{background:rgba(255,255,255,.2);width:72px;height:72px;font-size:40px;border-radius:22px;flex:none}
.hero h1{font-size:36px;font-weight:800;line-height:1.05}
.hero p{margin:6px 0 0;opacity:.85;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:640px){.tiles{grid-template-columns:1fr}}
.tile{background:var(--card);border-radius:var(--r);padding:24px 22px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:6px;min-height:190px;transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile .ic{font-size:38px;margin-bottom:auto}
.tiles.four{grid-template-columns:repeat(2,1fr)}
@media (max-width:640px){.tiles.four{grid-template-columns:1fr}}
.tile.examtile{background:linear-gradient(135deg,#3A0E0C,var(--card) 70%);box-shadow:var(--shadow),inset 0 0 0 2px var(--acc)}
.pill.clock{color:var(--ink);font-variant-numeric:tabular-nums}
.pill.clock.warn{color:#FFC83D}
.pill.clock.late{color:#fff;background:var(--bad)}
.tile h3{font-size:24px;font-weight:700}
.tile span{color:var(--muted);font-weight:700;font-size:15px}
.hist{background:var(--card);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);margin-top:18px}
.hist h3{font-size:18px;margin-bottom:14px}
.hbars{display:flex;align-items:flex-end;gap:10px;height:110px}
.hb{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;max-width:70px}
.hb i{width:100%;border-radius:10px 10px 4px 4px;background:var(--acc);min-height:4px}
.hb i.low{background:#55555D}
.hb small{font-weight:800;font-size:13px;color:var(--muted)}

/* Lists */
.list{display:flex;flex-direction:column;gap:12px}
.row{background:var(--card);border-radius:20px;padding:18px 20px;box-shadow:var(--shadow);display:flex;align-items:center;gap:16px;text-align:left;width:100%;transition:transform .12s}
.row:active{transform:scale(.99)}
.num{width:44px;height:44px;border-radius:14px;background:var(--accsoft);color:var(--acc);display:grid;place-items:center;font-weight:800;font-family:"Bricolage Grotesque",system-ui,sans-serif;flex:none}
.num.done{background:var(--okbg);color:var(--ok)}
.row .t{flex:1;font-weight:700}
.row .t small{display:block;color:var(--muted);font-weight:600;font-size:14px}

/* Lesson */
.article{background:var(--card);border-radius:28px;padding:34px clamp(22px,5vw,48px);box-shadow:var(--shadow);font-size:19px;line-height:1.7}
.article h1{font-size:34px;font-weight:800;margin-bottom:18px;line-height:1.1}
.article h3{font-size:23px;margin:28px 0 8px}
.article p{margin:0 0 14px}
.article ul{margin:0 0 16px;padding-left:24px}
.article li{margin-bottom:6px}
.article li.sub{margin-left:22px;list-style:circle}
.article li.num{list-style:none;margin-left:-20px}
.tblwrap{overflow-x:auto;margin:6px 0 18px}
.tbl{border-collapse:collapse;width:100%;font-size:15px}
.tbl th{background:var(--acc);color:#fff;text-align:left;padding:8px 10px;font-weight:800}
.tbl td{padding:8px 10px;border-bottom:1px solid #34343B;vertical-align:top}
.tbl tr:nth-child(even) td{background:rgba(255,255,255,.03)}
.article code{background:#2A2A30;padding:2px 6px;border-radius:6px;font-size:.9em}
.merke{background:var(--accsoft);border-left:5px solid var(--acc);border-radius:14px;padding:14px 18px;margin:18px 0;font-weight:600}
.sect{display:flex;align-items:center;gap:12px;margin:36px 0 16px}
.sect h2{font-size:26px;font-weight:800}

/* Question */
.qcard{background:var(--card);border-radius:28px;padding:28px;box-shadow:var(--shadow);margin-bottom:18px}
.qhead{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--acc);margin-bottom:8px}
.qtext{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:clamp(23px,3.4vw,29px);font-weight:700;line-height:1.25;margin-bottom:22px}
.qtext .not{background:var(--badbg);color:var(--bad);padding:0 6px;border-radius:6px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:16px 18px;border-radius:18px;border:2px solid var(--line);background:var(--card2);font-weight:700;font-size:18px;min-height:64px;transition:transform .1s,border-color .15s,background .15s}
.opt:active{transform:scale(.99)}
.opt .l{width:36px;height:36px;border-radius:11px;background:#2C2C32;display:grid;place-items:center;font-weight:800;flex:none;font-family:"Bricolage Grotesque"}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg);animation:shake .35s}
.opt.bad .l{background:var(--bad);color:#fff}
.opt.dim{opacity:.45}
.opts.locked .opt{pointer-events:none}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:18px;border-radius:18px;padding:16px 18px;font-size:17px}
.fb.ok{background:var(--okbg)}
.fb.bad{background:var(--badbg)}
.fb b{display:block;font-size:19px;margin-bottom:2px}
.prog{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.prog .bar{flex:1;height:12px}
.prog .bar i{background:var(--acc);transition:width .4s}
.prog b{font-weight:800;min-width:64px;text-align:right}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--open)}
.dots i.ok{background:var(--ok)} .dots i.bad{background:var(--bad)} .dots i.cur{outline:3px solid var(--acc);outline-offset:2px}
.sticky{position:sticky;bottom:16px;display:flex;justify-content:flex-end;margin-top:18px}

/* Result */
.result{text-align:center;padding-top:10px}
.ringwrap{position:relative;width:220px;height:220px;margin:10px auto 18px}
.ringwrap .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:58px;font-weight:800}
.result h1{font-size:34px;font-weight:800}
.result .sub{color:var(--muted);font-weight:600;margin:6px 0 26px}
.badge{display:inline-block;padding:6px 14px;border-radius:999px;font-weight:800;font-size:15px;margin-bottom:12px}
.badge.ok{background:var(--okbg);color:var(--ok)} .badge.bad{background:var(--badbg);color:var(--bad)}
.wronglist{text-align:left;margin-top:30px}
.wl{background:var(--card);border-radius:18px;padding:16px 20px;box-shadow:var(--shadow);margin-bottom:10px}
.wl .q{font-weight:700;margin-bottom:6px}
.wl .a{color:var(--ok);font-weight:700;font-size:16px}
.wl .y{color:var(--bad);font-weight:600;font-size:15px;text-decoration:line-through}

/* Workbook */
.wbtop{background:var(--card);border-radius:28px;padding:26px;box-shadow:var(--shadow);margin-bottom:18px}
.wbtop .bar{height:22px;border-radius:12px;margin:16px 0 20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{border-radius:18px;padding:16px;text-align:left}
.stat b{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:36px;line-height:1}
.stat span{font-weight:700;font-size:15px}
.stat small{display:block;opacity:.7;font-weight:700;font-size:13px;margin-top:2px}
.s-open{background:#232328} .s-ok{background:var(--okbg);color:var(--ok)} .s-bad{background:var(--badbg);color:var(--bad)}
.filters{display:flex;gap:8px;margin:20px 0 14px;flex-wrap:wrap}
.f{padding:10px 18px;border-radius:999px;background:var(--card);font-weight:800;font-size:15px;box-shadow:var(--shadow)}
.f.on{background:var(--acc);color:#fff}
.qrow{background:var(--card);border-radius:16px;padding:14px 18px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);margin-bottom:8px}
.qrow .d{width:14px;height:14px;border-radius:50%;background:var(--open);flex:none}
.qrow .d.ok{background:var(--ok)} .qrow .d.bad{background:var(--bad)}
.qrow .t{flex:1;font-weight:600;font-size:16px}
.qrow small{color:var(--muted);font-weight:700;font-size:13px;white-space:nowrap}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
:root{--gold:#FFC83D}
.semchips{display:flex;gap:10px;overflow-x:auto;margin:6px 0 16px;padding-bottom:4px}
.semchip{flex:none;background:var(--card);border-radius:16px;padding:10px 16px;font-weight:800;font-size:15px;text-align:left;box-shadow:var(--shadow);border:2px solid transparent}
.semchip small{display:block;font-size:12px;color:var(--muted);font-weight:700}
.semchip.on{border-color:var(--acc);background:#2A1212}
.subj{font-size:20px;margin:22px 0 12px;color:var(--ink)}
.gwrap{max-width:1100px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 12px calc(20px + env(safe-area-inset-bottom))}
.gtop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ghud{flex:1;display:flex;gap:8px;flex-wrap:wrap}
.gh{background:var(--card);border-radius:999px;padding:7px 12px;font-weight:800;font-size:15px;box-shadow:var(--shadow)}
.gh b{color:var(--gold)} .gh.hot{color:var(--gold);outline:2px solid var(--gold)}
.gsp{min-width:52px;justify-content:center;color:var(--ink)}
.gcanvas{position:relative;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);touch-action:manipulation;max-width:calc((100vh - 140px) * 1.5625);max-width:calc((100dvh - 140px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 1.5625);margin:0 auto}
.gcanvas canvas{width:100%;height:auto;display:block}
.gbar{display:flex;align-items:center;gap:12px;margin-top:12px}
.ghint{color:var(--muted);font-weight:700;font-size:14px;text-align:center;margin-top:10px}
.gpanel{position:fixed;left:50%;transform:translateX(-50%);width:min(760px,calc(100% - 24px));z-index:30;background:rgba(24,24,28,.97);border:1px solid var(--line);border-radius:20px;padding:16px 18px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.gpanel.at-bottom{bottom:calc(14px + env(safe-area-inset-bottom))}
.gpanel.at-top{top:calc(70px + env(safe-area-inset-top))}
.gx{position:absolute;right:12px;top:10px;width:34px;height:34px;border-radius:50%;background:var(--card2);font-weight:800}
.gwbtn{min-height:44px;padding:10px 18px;font-size:16px}
.gpanel>b{display:block;font-size:17px;margin-bottom:10px}
.gmeta{display:block;color:var(--muted);font-weight:700;margin:-4px 0 12px}
.gbuild{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media (max-width:640px){.gbuild{grid-template-columns:repeat(3,1fr)}}
.gb{background:var(--card2);border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;border:2px solid transparent}
.gb span{font-size:28px} .gb b{font-size:13px} .gb small{font-weight:800;color:var(--gold);font-size:13px}
.gb.off{opacity:.4}
.gmodal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.72);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top)) 14px 40px}
.gcard{width:100%;max-width:760px;background:var(--bg);border-radius:26px;padding:16px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.gcard .qcard{margin-bottom:0;box-shadow:none}
.gcard.center{text-align:center;padding:30px 20px}
.gcard h2{font-size:28px;margin:6px 0 12px}
.qtimer{position:relative;height:26px;border-radius:999px;background:var(--card2);overflow:hidden;margin-bottom:12px}
.qtimer i{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,#2FBF71,#FFC83D);border-radius:999px}
.qtimer i.low{background:linear-gradient(90deg,#E10600,#FF5A4F)}
.qtimer span{position:absolute;right:12px;top:0;bottom:0;display:flex;align-items:center;font-weight:800;font-size:14px}
.grew{margin-top:12px;border-radius:16px;padding:12px 16px;font-weight:800;font-size:22px;text-align:center}
.grew small{font-size:14px;opacity:.85;font-weight:700}
.grew.ok{background:rgba(255,200,61,.12);color:var(--gold)} .grew.bad{background:var(--badbg);color:var(--bad);font-size:17px}
.gstats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
@media (max-width:640px){.gstats{grid-template-columns:repeat(2,1fr)}}
.gstats div{background:var(--card);border-radius:16px;padding:14px 10px;text-align:center}
.gstats b{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:28px;color:var(--gold)}
.gstats span{font-size:13px;font-weight:700;color:var(--muted)}
.twlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tw{background:var(--card2);border-radius:14px;padding:12px;display:grid;grid-template-columns:40px 1fr;column-gap:8px;align-items:center}
.tw .ti{font-size:28px;grid-row:span 2} .tw small{color:var(--muted);font-weight:700;font-size:12.5px}
.tw.locked{opacity:.5}
pre.code{background:#0E0E11;border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:0 0 18px;font:15px/1.55 ui-monospace,Menlo,monospace;color:#F3F1EC;overflow-x:auto;white-space:pre;tab-size:4}
pre.code.sm{font-size:13px;padding:10px 12px;margin:6px 0 8px}
.opt .ot{white-space:pre-wrap}
.opt.mono .ot{font-family:ui-monospace,Menlo,monospace;font-weight:600;font-size:16px}
.opt.sel{border-color:var(--gold);background:rgba(255,200,61,.08)}
.opt.sel .l{background:var(--gold);color:#000}
.opt .l.box{border-radius:8px}
.opt.ok.miss{border-style:dashed}
.mhint{font-size:14px;color:var(--gold);font-weight:700;margin:-6px 0 14px}
.fb .ex{margin-top:6px}
.fb ul.rl{margin:4px 0 0;padding-left:20px}
.fig{margin:22px 0;padding:0}
.fig svg{width:100%;height:auto;display:block;border-radius:18px}
.fig figcaption{font-size:14px;color:var(--muted);text-align:center;margin-top:8px;font-weight:600;line-height:1.4}
.qfig .fig{margin:16px 0 0}
.wl .q{word-break:break-word}

<body>
<div id="app"></div>
<canvas id="confetti"></canvas>
<script>
(function(){
"use strict";
const app = document.getElementById('app');
const LS_P = 'kopfsache.progress.v1', LS_M = 'kopfsache.modules.v1';
const NAME = 'Fabian';

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rand = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick = (a,n) => shuffle(a).slice(0,n);
const fmtDay = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
const clone = o => JSON.parse(JSON.stringify(o));

function figHtml(m, id){
  const f = m && m.figures && m.figures[id]; if (!f) return '';
  return '<figure class="fig">' + f.svg + (f.caption ? '<figcaption>' + esc(f.caption) + '</figcaption>' : '') + '</figure>';
}
function md(t, m){
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>');
  let html='', list=false, para=[], merke=[], table=[];
  const flushP=()=>{ if(para.length){ html+='<p>'+inline(para.join(' '))+'</p>'; para=[]; } };
  const closeL=()=>{ if(list){ html+='</ul>'; list=false; } };
  const flushM=()=>{ if(merke.length){ html+='<div class="merke">'+merke.map(inline).join('<br>')+'</div>'; merke=[]; } };
  const flushT=()=>{ if(!table.length) return;
    const rows = table.filter(r => !/^\|[\s:|-]+\|$/.test(r)).map(r => r.replace(/^\||\|$/g,'').split('|').map(c => c.trim()));
    html += '<div class="tblwrap"><table class="tbl">' + rows.map((r,i) => '<tr>' + r.map(c => i===0 ? '<th>'+inline(c)+'</th>' : '<td>'+inline(c)+'</td>').join('') + '</tr>').join('') + '</table></div>';
    table=[]; };
  const flushAll=()=>{ flushP(); closeL(); flushM(); flushT(); };
  let inCode = false, codeBuf = [];
  for (const raw of String(t||'').split('\n')){
    if (raw.trim().startsWith('```')){
      if (inCode){ html += '<pre class="code">' + esc(codeBuf.join('\n')) + '</pre>'; codeBuf = []; inCode = false; }
      else { flushAll(); inCode = true; }
      continue;
    }
    if (inCode){ codeBuf.push(raw); continue; }
    const l = raw.trim();
    if (!l){ flushAll(); continue; }
    if (l.startsWith('|') && l.endsWith('|')){ flushP(); closeL(); flushM(); table.push(l); continue; }
    flushT();
    if (l.startsWith('> ')){ flushP(); closeL(); merke.push(l.slice(2)); continue; }
    flushM();
    const fm = l.match(/^\[\[fig:([\w-]+)\]\]$/);
    if (fm){ flushP(); closeL(); html += figHtml(m, fm[1]); continue; }
    if (l.startsWith('## ')){ flushP(); closeL(); html+='<h3>'+inline(l.slice(3))+'</h3>'; continue; }
    if (/^[-•] /.test(l)){ flushP(); if(!list){ html+='<ul>'; list=true; } html+='<li'+(/^\s{2,}/.test(raw)?' class="sub"':'')+'>'+inline(l.slice(2))+'</li>'; continue; }
    if (/^\d+\. /.test(l)){ flushP(); if(!list){ html+='<ul>'; list=true; } html+='<li class="num">'+inline(l)+'</li>'; continue; }
    closeL(); para.push(l);
  }
  flushAll(); return html;
}

/* ---------- state ---------- */
let P = normP(lsGet(LS_P));
let S = { view:'welcome', modules: (lsGet(LS_M)||[]), semesters: (lsGet(LS_M+'.sem')||[]), sem: null, contentDate: lsGet(LS_M+'.date')||'', modId:null, lessonId:null, lq:[], test:null, filter:'all', note:null, confirmQuit:false };
function normP(p){ p = p && typeof p==='object' ? p : {}; return { q:p.q||{}, lessons:p.lessons||{}, tests:Array.isArray(p.tests)?p.tests:[], days:p.days||{}, coins:+p.coins||0, run:+p.run||0, ct:+p.ct||0, game: normGame(p.game) }; }
function normGame(g){ g = g && typeof g==='object' ? g : {}; const st = g.stats||{}; return { best:g.best||{}, bonus:g.bonus||{}, stats:{ games:+st.games||0, waves:+st.waves||0, right:+st.right||0, wrong:+st.wrong||0, kills:+st.kills||0, bestStreak:+st.bestStreak||0 } }; }

const mod = () => S.modules.find(m => m.id===S.modId);
const key = (m,q) => m.id+'::'+q.id;
const status = (m,q) => (P.q[key(m,q)]||{}).last;
function stats(m){
  const qs = m.questions||[]; let ok=0, bad=0;
  qs.forEach(q => { const s=status(m,q); if(s==='r') ok++; else if(s==='w') bad++; });
  const n = qs.length, open = n-ok-bad;
  const pc = x => n ? Math.round(x/n*100) : 0;
  return { n, ok, bad, open, pOk:pc(ok), pBad:pc(bad), pOpen: n ? 100-pc(ok)-pc(bad) : 0 };
}
function record(m,q,ok){
  const k = key(m,q), e = P.q[k] || {r:0,w:0};
  if (ok) e.r++; else e.w++;
  e.last = ok ? 'r' : 'w'; e.t = Date.now();
  P.q[k] = e;
  const d = fmtDay(new Date()); P.days[d] = (P.days[d]||0)+1;
  P.ct = Date.now();
  save();
}
function streak(){
  const d = new Date(); if (!P.days[fmtDay(d)]) d.setDate(d.getDate()-1);
  let n=0; while (P.days[fmtDay(d)]){ n++; d.setDate(d.getDate()-1); } return n;
}

/* ---------- question building (anti-auswendig) ---------- */
/* ---------- Rechenaufgaben mit Zufallszahlen ---------- */
const ri = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const r3 = x => (Math.round(x*1000)/1000).toFixed(3);
const root = n => { const s = Math.sqrt(n); return Number.isInteger(s) ? String(s) : '√' + n; };
const vec = v => '(' + v.join(', ') + ')';
function wrongs(correct, cands, fallback){
  const out = [], c = String(correct);
  for (const x of shuffle(cands.map(String))) { if (x !== c && !out.includes(x)) out.push(x); if (out.length === 3) break; }
  let k = 1;
  while (out.length < 3 && fallback) { const x = String(fallback(k++)); if (x !== c && !out.includes(x)) out.push(x); if (k > 50) break; }
  return out;
}
function bitsExplain(n){
  const parts = []; for (let p = 128; p >= 1; p /= 2) if (n & p) parts.push(p);
  return parts.join(' + ') + ' = ' + n;
}
const GEN = {
  bin2dec: { title:'Rechenaufgabe: Binärzahl → Dezimalzahl', make(){
    const n = ri(5, 250), b = n.toString(2).padStart(8,'0');
    const rev = parseInt(b.split('').reverse().join(''), 2);
    return { prompt:`Welche Dezimalzahl entspricht der Binärzahl ${b}?`, correct:String(n),
      wrong: wrongs(n, [n+1, n-1, rev, n+2, n^16, n^2, n+8, n-8].filter(x => x >= 0), k => n + 3*k),
      explain:`${b}: ${bitsExplain(n)}.` }; } },
  dec2bin: { title:'Rechenaufgabe: Dezimalzahl → Binärzahl', make(){
    const n = ri(5, 250), b = x => (x & 255).toString(2).padStart(8,'0');
    const rev = b(n).split('').reverse().join('');
    return { prompt:`Wie lautet die Zahl ${n} als 8-stellige Binärzahl?`, correct:b(n),
      wrong: wrongs(b(n), [b(n+1), b(n-1), rev, b(n^8), b(n^32), b(n^1)], k => b(n + 2*k)),
      explain:`${bitsExplain(n)} → ${b(n)}.` }; } },
  ascii: { title:'Rechenaufgabe: ASCII-Werte', make(){
    const kind = ri(0,2);
    let ch, code;
    if (kind === 0) { code = ri(65, 90); } else if (kind === 1) { code = ri(97, 122); } else { code = ri(48, 57); }
    ch = String.fromCharCode(code);
    if (Math.random() < 0.5) {
      return { prompt:`Welchen ASCII-Wert (dezimal) hat das Zeichen „${ch}“?`, correct:String(code),
        wrong: wrongs(code, [code+1, code-1, code+32, code-32, code+2], k => code + 3 + k),
        explain:`A = 65 … Z = 90, a = 97 … z = 122, „0“ = 48 … „9“ = 57. „${ch}“ = ${code}.` };
    }
    const alt = [code+1, code-1, code+32, code-32, code+2].filter(c => c >= 33 && c <= 126).map(c => String.fromCharCode(c));
    return { prompt:`Welches Zeichen hat den ASCII-Wert ${code}?`, correct:ch,
      wrong: wrongs(ch, alt, k => String.fromCharCode(33 + ((code + 5*k) % 90))),
      explain:`A = 65 … Z = 90, a = 97 … z = 122, „0“ = 48 … „9“ = 57. ${code} = „${ch}“.` };
  } },
  mod: { title:'Rechenaufgabe: MOD (Rest der Division)', make(){
    if (Math.random() < 0.5) {
      const n = ri(11, 99), r = n % 2;
      const opts = ['0 → gerade', '1 → ungerade', '0 → ungerade', '1 → gerade'];
      const c = r === 0 ? opts[0] : opts[1];
      return { prompt:`EVEN-OR-ODD(${n}): Was ergibt ${n} MOD 2 – und welche Ausgabe folgt?`, correct:c, wrong: opts.filter(o => o !== c),
        explain:`${n} : 2 = ${Math.floor(n/2)} Rest ${r} → ${r === 0 ? '"EVEN" (gerade)' : '"ODD" (ungerade)'}.` };
    }
    const b = ri(3, 9), a = ri(b+1, 60), r = a % b;
    return { prompt:`Was ergibt ${a} MOD ${b}?`, correct:String(r),
      wrong: wrongs(r, [Math.floor(a/b), r+1, b-r, r-1, a-b].filter(x => x >= 0), k => r + k + 1),
      explain:`${a} : ${b} = ${Math.floor(a/b)} Rest ${r}. MOD liefert den Rest.` };
  } },
  linsearch: { title:'Rechenaufgabe: Lineare Suche', make(){
    const n = ri(7, 10), set = new Set(); while (set.size < n) set.add(ri(1, 99));
    const A = [...set].sort((a,b) => a-b);
    const missing = Math.random() < 0.2;
    let x, idx;
    if (missing) { do { x = ri(1, 99); } while (set.has(x)); idx = 'NOT-FOUND'; }
    else { idx = ri(0, n-1); x = A[idx]; }
    const c = String(idx);
    const cands = missing ? ['0', String(n), String(n-1), '−1'] : [idx+1, idx-1, x, 'NOT-FOUND', n].filter(v => v !== -1).map(String);
    return { prompt:`LINEAR-SEARCH(A, ${n}, ${x}) mit A = [${A.join(', ')}]. Was gibt der Algorithmus zurück?`, correct:c,
      wrong: wrongs(c, cands, k => String(n + k)),
      explain: missing ? `${x} kommt nicht vor → answer bleibt NOT-FOUND.` : `${x} steht an Index ${idx} (Zählung ab 0) → answer = ${idx}.` };
  } },
  binfirst: { title:'Rechenaufgabe: Binäre Suche – Mitte', make(){
    const n = ri(6, 21), M = Math.floor((n-1)/2);
    const set = new Set(); while (set.size < n) set.add(ri(1, 99));
    const A = [...set].sort((a,b) => a-b);
    if (Math.random() < 0.5)
      return { prompt:`BINARY-SEARCH auf einer sortierten Liste mit n = ${n} Elementen: Welcher Index M wird zuerst geprüft?`, correct:String(M),
        wrong: wrongs(M, [Math.ceil((n-1)/2) === M ? M+1 : Math.ceil((n-1)/2), Math.floor(n/2) === M ? M-1 : Math.floor(n/2), n-1, 0, M+2], k => M + k + 2),
        explain:`L = 0, R = ${n-1} → M = 0 + floor((${n-1} − 0)/2) = ${M}.` };
    return { prompt:`BINARY-SEARCH in A = [${A.join(', ')}]: Welcher Wert wird zuerst mit x verglichen?`, correct:String(A[M]),
      wrong: wrongs(A[M], [A[M+1], A[M-1], A[0], A[n-1], A[Math.floor(n/2)]].filter(v => v !== undefined)),
      explain:`n = ${n}, L = 0, R = ${n-1} → M = floor(${n-1}/2) = ${M} → A[${M}] = ${A[M]}.` };
  } },
  bool: { title:'Rechenaufgabe: Bedingungen (True/False)', make(){
    const points = ri(0, 20), names = ['Luca','Lea','Ben','Mia'], player = rand(names);
    const mk = () => {
      const k = ri(0, 20), nm = rand(names), t = ri(0, 5);
      const parts = [
        [`points > ${k}`, points > k], [`points <= ${k}`, points <= k], [`points == ${k}`, points === k], [`points != ${k}`, points !== k],
        [`player == "${nm}"`, player === nm], [`player != "${nm}"`, player !== nm]];
      const a = rand(parts), b = rand(parts);
      if (t === 0) return [a[0], a[1]];
      if (t === 1) return [`${a[0]} and ${b[0]}`, a[1] && b[1]];
      if (t === 2) return [`${a[0]} or ${b[0]}`, a[1] || b[1]];
      if (t === 3) return [`not ${a[0]}`, !a[1]];
      return [`${a[0]} and not ${b[0]}`, a[1] && !b[1]];
    };
    const want = Math.random() < 0.7;
    let good = null; const bad = []; let tries = 0;
    while ((good === null || bad.length < 3) && tries++ < 400) {
      const [e, v] = mk();
      if (v === want && good === null) good = e;
      else if (v !== want && !bad.includes(e) && bad.length < 3) bad.push(e);
    }
    return { prompt:`Gegeben: points = ${points} und player = "${player}". Welcher Ausdruck ergibt ${want ? 'True' : 'False'}?`, correct:good, wrong:bad, inverse:!want,
      explain:`„${good}“ ergibt ${want ? 'True' : 'False'}. Bei and müssen beide Teile stimmen, bei or reicht einer, not dreht um.` };
  } },
  vecadd: { title:'Rechenaufgabe: Vektoren addieren', make(){
    const u = [ri(-3,5), ri(-3,5)], v = [ri(-3,5), ri(-3,5)], s = [u[0]+v[0], u[1]+v[1]];
    return { prompt:`u = ${vec(u)}, v = ${vec(v)}. Was ist u + v?`, correct:vec(s),
      wrong: wrongs(vec(s), [vec([u[0]+v[1], u[1]+v[0]]), vec([u[0]-v[0], u[1]-v[1]]), vec([u[0]*v[0], u[1]*v[1]]), vec([s[0]+1, s[1]]), vec([s[1], s[0]])], k => vec([s[0]+k, s[1]-k])),
      explain:`Komponentenweise: (${u[0]} + ${v[0]}, ${u[1]} + ${v[1]}) = ${vec(s)}.` }; } },
  vecscale: { title:'Rechenaufgabe: Vektoren skalieren', make(){
    const k = ri(2,4), u = [ri(-3,5), ri(-3,5)], s = [k*u[0], k*u[1]];
    return { prompt:`Was ist ${k} · ${vec(u)}?`, correct:vec(s),
      wrong: wrongs(vec(s), [vec([k*u[0], u[1]]), vec([u[0]+k, u[1]+k]), vec([u[0], k*u[1]]), vec([k+u[0], k*u[1]])], j => vec([s[0]+j, s[1]])),
      explain:`Jede Komponente mal ${k}: (${k}·${u[0]}, ${k}·${u[1]}) = ${vec(s)}.` }; } },
  vecdist: { title:'Rechenaufgabe: Euklidischer Abstand', make(){
    let dx, dy; do { dx = ri(0,4); dy = ri(0,4); } while (dx === 0 && dy === 0);
    const u = [ri(-2,4), ri(-2,4)], v = [u[0] + (Math.random()<.5?dx:-dx), u[1] + (Math.random()<.5?dy:-dy)];
    const d2 = dx*dx + dy*dy;
    return { prompt:`Wie groß ist der euklidische Abstand zwischen ${vec(u)} und ${vec(v)}?`, correct:root(d2),
      wrong: wrongs(root(d2), [String(dx+dy), root(dx+dy), String(d2), root(d2+2), String(Math.abs(dx-dy)), root(d2-1)].filter(x => x !== '√0' && x !== '0'), k => root(d2 + 2*k + 1)),
      explain:`d = √((${u[0]} − ${v[0]})² + (${u[1]} − ${v[1]})²) = √(${dx*dx} + ${dy*dy}) = ${root(d2)}.` }; } },
  logz: { title:'Rechenaufgabe: Logistische Regression', make(){
    const nz = () => { let x; do { x = ri(-3,3); } while (x === 0); return x; };
    const w0 = ri(-6,6), w1 = nz(), w2 = nz(), x1 = ri(0,5), x2 = ri(0,5), z = w0 + w1*x1 + w2*x2;
    const head = `w₀ = ${w0}, w₁ = ${w1}, w₂ = ${w2}; Eingabe x₁ = ${x1}, x₂ = ${x2}.`;
    const calc = `z = ${w0} + ${w1}·${x1} + ${w2}·${x2} = ${z}`;
    if (Math.random() < 0.55)

function buildQ(q, m){
  const fig = q.fig && m && m.figures && m.figures[q.fig] ? q.fig : null;
  if (Array.isArray(q.options) && Array.isArray(q.answers)) {
    // Originalfrage: Text, Code und Antworten unverändert, Reihenfolge wie im Original
    let options = q.options.map(String), answers = q.answers.slice();
    if (q.exam && !q.keep){
      // Prof-Fragen: Text wortgetreu, aber Reihenfolge gemischt (gegen Auswendiglernen); „Keine der …“ bleibt am Ende
      const idx = options.map((_,i) => i), tail = idx.filter(i => /^Keine der/i.test(options[i])), body = shuffle(idx.filter(i => !tail.includes(i))), order = body.concat(tail);
      answers = answers.map(a => order.indexOf(a)); options = order.map(i => options[i]);
    }
    return { prompt:q.prompt||'', code:q.code||'', options, answers, answer:answers[0], multi: answers.length>1 || !!q.multi,
             explain:q.explain||'', fig, original:!q.exam, exam:!!q.exam, src:q.src||'', mono:!!q.mono };
  }
  if (q.gen && GEN[q.gen]) {
    let g; try { g = GEN[q.gen].make(); } catch(e) { g = null; }
    if (g && g.correct != null && g.wrong && g.wrong.length) {
      const options = shuffle([String(g.correct), ...g.wrong.slice(0,3).map(String)]);
      const a = options.indexOf(String(g.correct));
      return { prompt:g.prompt, code:g.code||'', mono:!!g.mono, options, answer:a, answers:[a], inverse:!!g.inverse, explain: g.explain || q.explain || '', fig, gen:true };
    }
  }
  const corr = q.correct||[], wr = q.wrong||[];
  const inverse = Array.isArray(q.notPrompts) && q.notPrompts.length && corr.length>=3 && wr.length && Math.random()<0.3;
  let prompt, answer, others;
  if (inverse){ prompt = rand(q.notPrompts); answer = rand(wr); others = pick(corr,3); }
  else { prompt = rand(q.prompts && q.prompts.length ? q.prompts : ['?']); answer = rand(corr); others = pick(wr,3); }
  const options = shuffle([answer, ...others]);
  const a = options.indexOf(answer);
  return { prompt, code:q.code||'', mono:!!q.mono, options, answer:a, answers:[a], inverse:!!inverse, explain: q.explain||'', fig };
}
function selectQs(m, mode, n){
  n = n || 10;
  const isExam = mode==='exam' || mode==='examWrong';
  const qs = isExam ? examQs(m) : (m.questions||[]), st = q => status(m,q);
  if (mode==='examWrong') return shuffle(qs.filter(q => st(q)==='w')).slice(0,n);
  if (mode==='wrong') return shuffle(qs.filter(q => st(q)==='w')).slice(0,n);
  if (mode==='open')  return shuffle(qs.filter(q => !st(q))).slice(0,n);
  if (mode==='right') return shuffle(qs.filter(q => st(q)==='r')).slice(0,n);
  const wrong = shuffle(qs.filter(q => st(q)==='w'));
  const open  = shuffle(qs.filter(q => !st(q)));
  const right = qs.filter(q => st(q)==='r')
    .map(q => ({q, t:(P.q[key(m,q)].t||0) + Math.random()*36e5*12}))
    .sort((a,b) => a.t-b.t).map(x => x.q);
  const want = Math.min(wrong.length, Math.ceil(n*0.4));
  const out = wrong.slice(0,want);
  for (const arr of [open, right, wrong.slice(want)]) for (const q of arr){ if (out.length>=n) break; out.push(q); }
  return shuffle(out);
}
function promptHtml(b){
  let p = esc(b.prompt);
  if (b.inverse) p = p.replace(/\b(NICHT|FALSCH|False|KEIN|KEINE)\b/g,'<span class="not">$1</span>');
  return p;
}

  const seen = new Set(out.tests.map(t => t.t));
  b.tests.forEach(t => { if (!seen.has(t.t)) out.tests.push(t); });
  out.tests.sort((x,y) => x.t-y.t); out.tests = out.tests.slice(-150);
  for (const d in b.days) out.days[d] = Math.max(out.days[d]||0, b.days[d]);
  if ((b.ct||0) > (out.ct||0)){ out.coins=b.coins; out.run=b.run; out.ct=b.ct; }
  const ga = out.game, gb = b.game;
  for (const k in gb.best){ const x = ga.best[k], y = gb.best[k]; if (!x || (y.wave||0) > (x.wave||0) || ((y.wave||0) === (x.wave||0) && (y.score||0) > (x.score||0))) ga.best[k] = y; }
  Object.assign(ga.bonus, gb.bonus);
  for (const k in gb.stats) ga.stats[k] = Math.max(ga.stats[k]||0, gb.stats[k]||0);
  return out;
}
function sortMods(list){ return list.slice().sort((a,b) => (a.order??99)-(b.order??99) || String(a.title).localeCompare(String(b.title))); }

async function init(){
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  if ('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const w = reg.installing; if (!w) return;
        w.addEventListener('statechange', () => { if (w.state==='installed' && navigator.serviceWorker.controller) S.updateReady = true; });
      });
    }).catch(() => {});
  }
  try {
    const r = await fetch('content.json', { cache:'no-cache' });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    const mods = sortMods((j.modules||[]).filter(m => m && m.id));
    const count = list => list.reduce((a,m) => a + (m.questions||[]).length + (m.lessons||[]).length, 0);
    const before = S.modules.length ? count(S.modules) : null;
    const changed = JSON.stringify(mods) !== JSON.stringify(S.modules);
    S.modules = mods; S.semesters = Array.isArray(j.semesters) ? j.semesters : []; lsSet(LS_M+'.sem', S.semesters); S.contentDate = j.updated || ''; lsSet(LS_M, mods); lsSet(LS_M+'.date', S.contentDate);
    if (changed){
      if (before !== null && count(mods) > before) S.toast = '<span class="c">📚</span> Neuer Stoff da!';
      if (!S.test) render();
    }
  } catch(e){
    if (!S.modules.length){ S.note = 'Du bist offline und es ist noch kein Stoff gespeichert. Öffne die App einmal mit Internet.'; render(); }
  }
}

  const one = (k, count, pct) => {

function pickAnswer(it, j, m){
  if (it.ok !== undefined) return;
  if (it.b.multi){ it.sel = it.sel || []; const k = it.sel.indexOf(j); if (k >= 0) it.sel.splice(k, 1); else it.sel.push(j); render(); return; }
  finishAnswer(it, j, m);
}
function finishAnswer(it, chosen, m){
  if (it.ok !== undefined) return;
  if (Array.isArray(chosen)){
    if (!chosen.length) return;
    const a = it.b.answers.slice().sort().join(','), c = chosen.slice().sort().join(',');
    it.ok = a === c;
  } else it.ok = it.b.answers.includes(chosen);
  it.chosen = chosen;
  const q = m && (m.questions||[]).find(x => x.id===it.qid);
  if (q) record(m, q, it.ok);
  if (it.onDone) it.onDone(it);
  render();
}

/* Alle Werte zum Balancing an einer Stelle: */
const GCFG = {
  reward: { 1: 10, 2: 20, 3: 30 },          // Münzen nach Schwierigkeit
  levelName: { 1: 'Leicht', 2: 'Mittel', 3: 'Schwer' },
  mult: s => s >= 10 ? 5 : s >= 8 ? 4 : s >= 5 ? 3 : s >= 3 ? 2 : 1,   // Serie → Multiplikator
  repeatBonus: 10,                           // Lernbonus für mehrfach falsch beantwortete Fragen (einmal pro Frage)
  repeatShare: 0.3,                          // Anteil Wiederholungsfragen aus dem roten Stapel
  startQuestions: 10,                        // Startfragen vor jeder Runde
  qTime: 60,                                 // Sekunden pro Frage
  lives: 20,
  firstQ: 6, everyQ: 16,                     // Fragen während einer Welle: nach 6 s, dann alle 16 s (Spielzeit)
};
const TOWERS = {
  bogen: { name:'Bogenschützen', icon:'🏹', color:'#C98B3A', cost:50,  dmg:9,  rate:0.55, range:150, splash:0,  desc:'schnell · wenig Schaden · günstig' },
  magie: { name:'Magieturm',     icon:'🔮', color:'#8A5CF6', cost:100, dmg:14, rate:1.3,  range:130, splash:60, desc:'langsamer · Flächenschaden' },
  kanone:{ name:'Kanone',        icon:'💣', color:'#9AA0A6', cost:150, dmg:48, rate:2.0,  range:175, splash:28, desc:'hoher Schaden · langsam · teuer' },
  eis:   { name:'Eisturm',       icon:'❄️', color:'#4DA3FF', cost:90,  dmg:3,  rate:1.0,  range:120, splash:55, slow:0.5, desc:'verlangsamt Gegner', unlock:5 },
  blitz: { name:'Blitzturm',     icon:'⚡', color:'#FFC83D', cost:200, dmg:22, rate:1.2,  range:165, splash:0,  chain:3, desc:'springt auf 3 Gegner über', unlock:10 },
};
const TOWER_ORDER = ['bogen','magie','kanone','eis','blitz'];
const ENEMY = {
  normal: { hp:1,   speed:62,  r:12, color:'#E04848', lives:1, score:10 },
  schnell:{ hp:0.55,speed:108, r:9,  color:'#FFB547', lives:1, score:12 },
  panzer: { hp:3.2, speed:38,  r:16, color:'#A34DD9', lives:3, score:30 },
  boss:   { hp:14,  speed:30,  r:24, color:'#FF2A1F', lives:10, score:150 },
};
const GW = 1000, GH = 640;
const PATH = [[-30,120],[260,120],[260,420],[520,420],[520,180],[780,180],[780,500],[1030,500]];
const SLOTS_RAW = [[90,50],[190,50],[110,195],[180,300],[340,250],[330,500],[450,500],[390,340],[440,250],[600,330],[600,100],[700,100],[650,260],[860,300],[700,420],[880,580],[930,420],[860,110]];
const segLen = PATH.slice(1).map((p,i) => Math.hypot(p[0]-PATH[i][0], p[1]-PATH[i][1]));
const PATH_LEN = segLen.reduce((a,b) => a+b, 0);
function distToPath(x, y){
  let best = 1e9;
  for (let i = 0; i < PATH.length-1; i++){
    const [ax,ay] = PATH[i], [bx,by] = PATH[i+1], dx = bx-ax, dy = by-ay;
    const t = Math.max(0, Math.min(1, ((x-ax)*dx + (y-ay)*dy) / (dx*dx+dy*dy)));
    best = Math.min(best, Math.hypot(x-(ax+t*dx), y-(ay+t*dy)));
  }
  return best;
}
const SLOTS = SLOTS_RAW.filter(([x,y]) => distToPath(x,y) >= 55);
function posAt(d){
  for (let i = 0; i < segLen.length; i++){
    if (d <= segLen[i]){ const t = d/segLen[i]; return [PATH[i][0] + (PATH[i+1][0]-PATH[i][0])*t, PATH[i][1] + (PATH[i+1][1]-PATH[i][1])*t]; }
    d -= segLen[i];
  }
  return PATH[PATH.length-1];
}
function waveSpec(n){
  const list = [], count = 5 + 2*n;
  for (let i = 0; i < count; i++){
    let t = 'normal';
    if (n >= 3 && i % 3 === 2) t = 'schnell';
    if (n >= 5 && i % 5 === 4) t = 'panzer';
    list.push(t);
  }
  if (n % 10 === 0) list.push('boss');
  return list;
}
const hpBase = n => (n <= 2 ? 22 : 26) * Math.pow(1.17, n-1);
function towerStats(t){
  const b = TOWERS[t.type], L = t.level - 1;
  return { dmg: b.dmg * Math.pow(1.5, L), range: b.range * (1 + 0.12*L), rate: b.rate * Math.pow(0.86, L), splash: b.splash ? b.splash * (1 + 0.1*L) : 0, slow: b.slow, chain: b.chain ? b.chain + L : 0 };
}
const upCost = t => Math.round(TOWERS[t.type].cost * 0.7 * t.level);
const towerUnlocked = k => !TOWERS[k].unlock || bestWaveAll() >= TOWERS[k].unlock;

/* ---------- Fragen fürs Spiel: aus dem bestehenden Lernsystem ---------- */
function gamePickQuestion(G){
  const m = G.m, qs = (m.questions||[]).filter(q => !G.used.has(q.id));
  const pool = qs.length ? qs : (m.questions||[]);
  if (!qs.length) G.used.clear();
  const red = pool.filter(q => status(m,q) === 'w');
  const q = (red.length && Math.random() < GCFG.repeatShare) ? rand(red) : rand(pool);
  G.used.add(q.id);
  const e = P.q[key(m,q)] || { r:0, w:0 };
  const repeat = e.last === 'w' && (e.w||0) >= 2 && !P.game.bonus[key(m,q)];
  return { qid:q.id, b:buildQ(q, m), chosen:null, sel:[], level: q.level || 2, repeat, wasRed: e.last === 'w', start: performance.now(), onDone: gameOnAnswer };
}
function gameAsk(G, kind){
  G.q = gamePickQuestion(G); G.qKind = kind; G.paused = true; G.reward = null;
  renderGameUI();
}
function gameOnAnswer(it){
  const G = S.play; if (!G || G.q !== it) return;
  const st = P.game.stats;
  if (it.ok){
    G.streak++; G.errStreak = 0; st.right++; st.bestStreak = Math.max(st.bestStreak, G.streak);
    const base = GCFG.reward[it.level] || 20, mult = GCFG.mult(G.streak);
    let bonus = 0;
    if (it.repeat){ bonus = GCFG.repeatBonus; P.game.bonus[key(G.m, {id:it.qid})] = Date.now(); }
    const total = (base + bonus) * mult;
    G.coins += total; G.earned += total; G.right++;
    G.reward = { ok:true, base, bonus, mult, total };
  } else {
    G.streak = 0; G.errStreak++; st.wrong++; G.wrong++;
    let extra = [];
    if (G.phase !== 'quiz'){
      if (G.errStreak === 1) extra = ['normal'];
      else if (G.errStreak === 2) extra = ['normal','normal'];
      else { extra = ['panzer','panzer','panzer']; G.errStreak = 0; }   // starke Gruppe, danach beginnt die Fehler-Serie neu
      G.queue.push(...extra.map(t => ({ t, extra:true })));
    }
    G.reward = { ok:false, extra, timeout: !!it.timeout };
  }
  save();
}
function gameCloseQuestion(){
  const G = S.play; if (!G) return;
  G.q = null; G.reward = null; G.paused = false;
  if (G.phase === 'quiz'){
    G.quizN++;
    if (G.quizN >= GCFG.startQuestions){ G.phase = 'build'; G.paused = false; }
    else { gameAsk(G, 'quiz'); return; }
  }
  renderGameUI();
}

/* ---------- Spielstart / Ablauf ---------- */
function gameStart(m){
  S.play = { m, phase:'quiz', coins:0, earned:0, lives:GCFG.lives, wave:0, towers:[], enemies:[], shots:[], fx:[], queue:[], spawnT:0, waveT:0, nextQ:GCFG.firstQ,
             streak:0, errStreak:0, right:0, wrong:0, kills:0, score:0, speed:1, sel:null, used:new Set(), quizN:0, q:null, paused:true, over:false, last:0 };
  P.game.stats.games++; save();
  S.view = 'play'; render(); window.scrollTo(0,0);
  gameAsk(S.play, 'quiz');
}
function gameStartWave(){
  const G = S.play; if (!G || G.phase !== 'build') return;
  G.wave++; G.phase = 'wave'; G.waveT = 0; G.nextQ = GCFG.firstQ; G.spawnT = 0;
  G.queue = waveSpec(G.wave).map(t => ({ t })).concat(G.queue.filter(x => x.extra));
  G.sel = null; renderGameUI();
}
function spawnEnemy(G, t){
  const d = ENEMY[t], hp = hpBase(G.wave) * d.hp;
  G.enemies.push({ t, d:0, hp, max:hp, speed:d.speed, slowT:0, r:d.r });
}
function gameOver(){
  const G = S.play; G.over = true; G.phase = 'over'; G.paused = true;
  const k = G.m.id, cur = P.game.best[k] || { wave:0, score:0 };
  const waves = Math.max(0, G.wave - 1);
  G.newRecord = waves > (cur.wave||0) || (waves === (cur.wave||0) && G.score > (cur.score||0));
  if (G.newRecord) P.game.best[k] = { wave: waves, score: G.score, date: Date.now() };
  P.game.stats.waves += waves; P.game.stats.kills += G.kills;
  save(); renderGameUI();
}

/* ---------- Spiel-Schleife ---------- */
let gameRaf = 0;
function gameLoop(ts){
  const G = S.play;
  if (!G || S.view !== 'play'){ gameRaf = 0; return; }
  const dtReal = Math.min(0.05, (ts - (G.last || ts)) / 1000); G.last = ts;
  // Fragen-Timer läuft in Echtzeit, Spiel steht währenddessen
  if (G.q && G.q.ok === undefined){
    const left = GCFG.qTime - (ts - G.q.start) / 1000;
    const bar = document.getElementById('qtimer'), lbl = document.getElementById('qtimerl');
    if (bar){ bar.style.width = Math.max(0, left / GCFG.qTime * 100) + '%'; bar.classList.toggle('low', left < 15); }
    if (lbl) lbl.textContent = Math.max(0, Math.ceil(left)) + ' s';
    if (left <= 0){ G.q.timeout = true; finishAnswer(G.q, -1, G.m); }
  }
  if (!G.paused && G.phase === 'wave'){
    for (let k = 0; k < G.speed; k++) gameStep(G, dtReal);
  }
  drawGame(G, ts);
  gameRaf = requestAnimationFrame(gameLoop);
}
function gameStep(G, dt){
  G.waveT += dt;
  // Gegner erzeugen
  G.spawnT -= dt;
  if (G.queue.length && G.spawnT <= 0){ spawnEnemy(G, G.queue.shift().t); G.spawnT = 0.8; }
  // Gegner bewegen
  for (const e of G.enemies){
    const sp = e.speed * (e.slowT > 0 ? 0.5 : 1); e.slowT -= dt;
    e.d += sp * dt;
    if (e.d >= PATH_LEN){ e.dead = true; G.lives -= ENEMY[e.t].lives; G.fx.push({ k:'hit', t:0.5 }); }
  }
  // Türme schießen
  for (const t of G.towers){
    t.cd -= dt; if (t.cd > 0) continue;
    const s = towerStats(t), [tx,ty] = t.pos;
    let target = null, bestD = -1;
    for (const e of G.enemies){ if (e.dead) continue; const [ex,ey] = posAt(e.d); if (Math.hypot(ex-tx, ey-ty) <= s.range && e.d > bestD){ bestD = e.d; target = e; } }
    if (!target) continue;
    t.cd = s.rate;
    const [ex,ey] = posAt(target.d);
    if (s.chain){
      let cur = target, hit = new Set(), from = [tx,ty];
      for (let c = 0; c < s.chain && cur; c++){
        hit.add(cur); const p = posAt(cur.d); damage(G, cur, s.dmg * (c ? 0.7 : 1)); G.shots.push({ a:from, b:p, t:0.15, color:'#FFC83D', w:3 });
        from = p; let nb = null, nd = 1e9;
        for (const e of G.enemies){ if (e.dead || hit.has(e)) continue; const q = posAt(e.d), dd = Math.hypot(q[0]-p[0], q[1]-p[1]); if (dd < 110 && dd < nd){ nd = dd; nb = e; } }
        cur = nb;
      }
    } else if (s.splash){
      for (const e of G.enemies){ if (e.dead) continue; const [qx,qy] = posAt(e.d); if (Math.hypot(qx-ex, qy-ey) <= s.splash){ damage(G, e, s.dmg); if (s.slow) e.slowT = 1.6; } }
      G.shots.push({ a:[tx,ty], b:[ex,ey], t:0.18, color:TOWERS[t.type].color, w:t.type === 'kanone' ? 5 : 3 });
      G.fx.push({ k:'boom', x:ex, y:ey, r:s.splash, t:0.3, color:TOWERS[t.type].color });
    } else {
      damage(G, target, s.dmg); G.shots.push({ a:[tx,ty], b:[ex,ey], t:0.12, color:TOWERS[t.type].color, w:2 });
    }
  }
  G.enemies = G.enemies.filter(e => !e.dead);
  for (const x of G.shots) x.t -= dt; G.shots = G.shots.filter(x => x.t > 0);
  for (const x of G.fx) x.t -= dt; G.fx = G.fx.filter(x => x.t > 0);
  if (G.lives <= 0){ G.lives = 0; gameOver(); return; }
  // Frage während der Welle
  if (G.waveT >= G.nextQ && (G.queue.length || G.enemies.length)){ G.nextQ = G.waveT + GCFG.everyQ; gameAsk(G, 'wave'); return; }
  // Welle geschafft
  if (!G.queue.length && !G.enemies.length){ G.phase = 'build'; G.score += 50 * G.wave; renderGameUI(); }
  G.hudT = (G.hudT || 0) - dt; if (G.hudT <= 0){ G.hudT = 0.25; updateHud(); }
}
function damage(G, e, dmg){
  if (e.dead) return; e.hp -= dmg;
  if (e.hp <= 0){ e.dead = true; G.kills++; G.score += ENEMY[e.t].score; }
}

/* ---------- Zeichnen ---------- */
function drawGame(G, ts){
  const cv = document.getElementById('gcv'); if (!cv) return;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0,0,GW,GH);
  ctx.fillStyle = '#121216'; ctx.fillRect(0,0,GW,GH);
  ctx.strokeStyle = 'rgba(255,255,255,.03)'; ctx.lineWidth = 1;
  for (let x = 0; x < GW; x += 40){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,GH); ctx.stroke(); }
  for (let y = 0; y < GH; y += 40){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(GW,y); ctx.stroke(); }
  // Weg
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = '#2A2A31'; ctx.lineWidth = 58; ctx.beginPath(); PATH.forEach(([x,y],i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y)); ctx.stroke();
  ctx.strokeStyle = '#34343C'; ctx.lineWidth = 46; ctx.stroke();
  ctx.setLineDash([10,14]); ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 2; ctx.stroke(); ctx.setLineDash([]);
  // Burg
  ctx.font = '44px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🏰', 965, 500);
  // Bauplätze & Türme
  SLOTS.forEach(([x,y], i) => {
    const t = G.towers.find(t => t.slot === i);
    if (G.sel === i){ const r = t ? towerStats(t).range : 0; if (r){ ctx.fillStyle = 'rgba(255,200,61,.08)'; ctx.strokeStyle = 'rgba(255,200,61,.5)'; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); ctx.stroke(); } }
    if (!t){
      ctx.strokeStyle = G.sel === i ? '#FFC83D' : 'rgba(255,255,255,.18)'; ctx.lineWidth = 2; ctx.setLineDash([5,5]);
      ctx.beginPath(); ctx.arc(x,y,24,0,7); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.font = 'bold 20px sans-serif'; ctx.fillText('+', x, y+1);
    } else {
      const b = TOWERS[t.type];
      ctx.fillStyle = '#1D1D22'; ctx.strokeStyle = b.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x,y,26,0,7); ctx.fill(); ctx.stroke();
      ctx.font = '24px serif'; ctx.fillText(b.icon, x, y+1);
      for (let l = 0; l < t.level; l++){ ctx.fillStyle = '#FFC83D'; ctx.beginPath(); ctx.arc(x-10+l*10, y+33, 3.5, 0, 7); ctx.fill(); }
    }
  });
  // Gegner
  for (const e of G.enemies){
    const [x,y] = posAt(e.d), d = ENEMY[e.t];
    ctx.fillStyle = d.color; ctx.beginPath(); ctx.arc(x,y,e.r,0,7); ctx.fill();
    if (e.slowT > 0){ ctx.strokeStyle = '#4DA3FF'; ctx.lineWidth = 3; ctx.stroke(); }
    if (e.t === 'boss'){ ctx.font = '22px serif'; ctx.fillText('👹', x, y+1); }
    const w = e.r * 2.2; ctx.fillStyle = '#000'; ctx.fillRect(x-w/2, y-e.r-9, w, 4);
    ctx.fillStyle = '#2FBF71'; ctx.fillRect(x-w/2, y-e.r-9, w * Math.max(0, e.hp/e.max), 4);
  }
  // Schüsse & Effekte
  for (const s of G.shots){ ctx.strokeStyle = s.color; ctx.lineWidth = s.w; ctx.globalAlpha = Math.min(1, s.t*8); ctx.beginPath(); ctx.moveTo(s.a[0], s.a[1]); ctx.lineTo(s.b[0], s.b[1]); ctx.stroke(); }
  ctx.globalAlpha = 1;
  for (const f of G.fx){
    if (f.k === 'boom'){ ctx.strokeStyle = f.color; ctx.globalAlpha = f.t/0.3; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1.2 - f.t), 0, 7); ctx.stroke(); }
    if (f.k === 'hit'){ ctx.fillStyle = 'rgba(225,6,0,' + (f.t*0.5) + ')'; ctx.fillRect(0,0,GW,GH); }
  }
  ctx.globalAlpha = 1;
}

/* ---------- Oberfläche ---------- */
function updateHud(){
  const G = S.play, h = document.getElementById('ghud'); if (!G || !h) return;
  const mult = GCFG.mult(G.streak);
  h.innerHTML = `<span class="gh"><b>🪙 ${G.coins}</b></span><span class="gh">❤️ ${G.lives}</span><span class="gh">🌊 Welle ${G.wave}</span><span class="gh ${mult>1?'hot':''}">🔥 ${G.streak} · ${mult}×</span><span class="gh">⭐ ${G.score}</span>`;
}
function vGame(){
  const m = S.gameMod && S.modules.find(x => x.id === S.gameMod);
  const st = P.game.stats;
  if (m){
    const best = P.game.best[m.id];
    const towers = TOWER_ORDER.map(k => { const t = TOWERS[k], ok = towerUnlocked(k);
      return `<div class="tw ${ok?'':'locked'}"><span class="ti">${t.icon}</span><b>${t.name}</b><small>${ok ? `${t.cost} 🪙 · ${t.desc}` : `🔒 ab Welle ${t.unlock}`}</small></div>`; }).join('');
    return `<div class="wrap fade">
      <div class="top">${backBtn('game','Modulwahl')}</div>
      <div class="hero"><div class="memo">🏰</div><div><h1>Study Defense</h1><p>${esc(m.emoji||'')} ${esc(m.title)} · Wissen ist die einzige Währung</p></div></div>
      <div class="gstats">
        <div><b>${best ? best.wave : 0}</b><span>Rekord-Welle</span></div>
        <div><b>${best ? best.score : 0}</b><span>Rekord-Punkte</span></div>
        <div><b>${st.games}</b><span>Spiele</span></div>
        <div><b>${st.right + st.wrong ? Math.round(st.right/(st.right+st.wrong)*100) : 0} %</b><span>richtig im Spiel</span></div>
      </div>
      <button class="btn big acc" style="width:100%;margin:18px 0" data-act="gStart">⚔️ Runde starten</button>
      <div class="setcard"><h3>So funktioniert's</h3>
        <p>• Zuerst <b>${GCFG.startQuestions} Startfragen</b> – damit verdienst du dein Startkapital.<br>
        • Münzen gibt es <b>nur für richtige Antworten</b>: Leicht ${GCFG.reward[1]} · Mittel ${GCFG.reward[2]} · Schwer ${GCFG.reward[3]}.<br>
        • Serie: 3 richtige in Folge = 2×, ab 5 = 3×, ab 8 = 4×, ab 10 = 5×.<br>
        • Mehrfach falsch beantwortete Fragen aus deinem roten Stapel bringen einmalig <b>+${GCFG.repeatBonus} Lernbonus</b>.<br>
        • Pro Frage hast du <b>${GCFG.qTime} Sekunden</b> – das Spiel pausiert so lange.<br>
        • Während der Wellen kommen weitere Fragen. Falsche Antworten schicken <b>zusätzliche Gegner</b>.<br>
        • Alle Antworten zählen auch für dein Übungsheft und deine Kartenstapel.</p></div>
      <div class="setcard"><h3>Türme</h3><div class="twlist">${towers}</div></div>
    </div>`;
  }
  return `<div class="wrap fade">
    <div class="top">${backBtn('home','Module')}</div>
    <h1 class="h-title">🏰 Study Defense</h1>
    <p class="h-sub">Welches Modul willst du spielen?</p>
    ${(() => { const sem = curSem(), row = x => { const b = P.game.best[x.id]; return `<button class="row" data-act="gamePick" data-id="${esc(x.id)}"><span class="num">${esc(x.emoji||'📘')}</span><span class="t">${esc(x.title)}<small>${(x.questions||[]).length} Fragen · Rekord: Welle ${b ? b.wave : 0}</small></span><span>›</span></button>`; };
      const now = S.modules.filter(x => modSem(x) === sem), other = S.modules.filter(x => modSem(x) !== sem);
      if (!S.modules.length) return `<div class="empty"><b>Noch keine Module da</b></div>`;
      return `<div class="list">${now.map(row).join('')}</div>` + (other.length ? `<h3 class="subj">Andere Semester</h3><div class="list">${other.map(row).join('')}</div>` : ''); })()}
  </div>`;
}
function vPlay(){
  return `<div class="gwrap">
    <div class="gtop"><button class="back" data-act="gQuit">✕</button><div id="ghud" class="ghud"></div><span id="gwave"></span><button class="pill gsp" data-act="gSpeed" id="gspeed">1×</button></div>
    <div class="gcanvas"><canvas id="gcv" width="${GW}" height="${GH}"></canvas></div>
    <div id="gui"></div>
  </div>`;
}
function renderGameUI(){
  const G = S.play, el = document.getElementById('gui'); if (!G || !el) return;
  updateHud();
  const sp = document.getElementById('gspeed'); if (sp) sp.textContent = G.speed + '×';
  const wb = document.getElementById('gwave');
  if (wb) wb.innerHTML = G.phase === 'build' && !G.q ? `<button class="btn acc gwbtn" data-act="gWave">🌊 Welle ${G.wave+1} starten</button>` : '';
  let h = '';
  if (G.phase === 'over'){
    const waves = Math.max(0, G.wave - 1);
    h = `<div class="gmodal"><div class="gcard center">
      <div style="font-size:56px">🏰💥</div><h2>Die Burg ist gefallen</h2>
      ${G.newRecord ? '<span class="badge ok">🏆 Neuer Rekord!</span>' : ''}
      <div class="gstats"><div><b>${waves}</b><span>Wellen überstanden</span></div><div><b>${G.score}</b><span>Punkte</span></div><div><b>${G.right}/${G.right+G.wrong}</b><span>Fragen richtig</span></div><div><b>${G.earned}</b><span>Münzen verdient</span></div></div>
      <div class="btnrow" style="justify-content:center;margin-top:18px"><button class="btn acc" data-act="gStart">Nochmal</button><button class="btn ghost" data-act="gExit">Zurück</button></div>
    </div></div>`;
  } else if (G.q){
    const it = G.q, answered = it.ok !== undefined;
    const lvl = GCFG.levelName[it.level] + ' · ' + GCFG.reward[it.level] + ' 🪙';
    const label = (G.qKind === 'quiz' ? `Startfrage ${G.quizN+1}/${GCFG.startQuestions}` : `Frage in Welle ${G.wave}`) + ' · ' + lvl + (it.repeat ? ' · 🔁 Wiederholung (+' + GCFG.repeatBonus + ' Bonus)' : '');
    let rew = '';
    if (answered){
      const r = G.reward || {};
      rew = r.ok ? `<div class="grew ok">+${r.total} 🪙 <small>(${r.base}${r.bonus ? ' + ' + r.bonus + ' Lernbonus' : ''}${r.mult > 1 ? ' × ' + r.mult + ' Serie' : ''})</small></div>`
                 : `<div class="grew bad">${r.timeout ? '⏰ Zeit abgelaufen' : 'Keine Münzen'}${r.extra && r.extra.length ? ` · ${r.extra.length === 3 ? '⚠️ starke Gegnergruppe' : '+' + r.extra.length + ' Gegner'} kommt` : ''}</small></div>`;
    }
    h = `<div class="gmodal"><div class="gcard">
      ${answered ? '' : `<div class="qtimer"><i id="qtimer"></i><span id="qtimerl">${GCFG.qTime} s</span></div>`}
      ${qBlock(it, 0, 'gAns', label, G.m, true)}
      ${answered ? rew + `<button class="btn acc big" style="width:100%;margin-top:12px" data-act="gNext">${G.phase === 'quiz' && G.quizN+1 >= GCFG.startQuestions ? '🏗️ Verteidigung aufbauen' : 'Weiter'}</button>` : ''}
    </div></div>`;
  } else if (G.phase === 'build'){
    let panel = '';
    if (G.sel !== null){
      const pos = SLOTS[G.sel][1] > 330 ? 'at-top' : 'at-bottom';
      const t = G.towers.find(t => t.slot === G.sel);
      if (!t){
        panel = `<div class="gpanel ${pos}"><button class="gx" data-act="gDesel">✕</button><b>Turm bauen</b><div class="gbuild">${TOWER_ORDER.map(k => { const b = TOWERS[k], ok = towerUnlocked(k), afford = G.coins >= b.cost;
          return `<button class="gb ${ok && afford ? '' : 'off'}" data-act="gBuy" data-k="${k}" ${ok && afford ? '' : 'disabled'}><span>${b.icon}</span><b>${b.name}</b><small>${ok ? b.cost + ' 🪙' : '🔒 Welle ' + b.unlock}</small></button>`; }).join('')}</div></div>`;
      } else {
        const b = TOWERS[t.type], s = towerStats(t), uc = upCost(t);
        panel = `<div class="gpanel ${pos}"><button class="gx" data-act="gDesel">✕</button><b>${b.icon} ${b.name} · Stufe ${t.level}/3</b><small class="gmeta">Schaden ${s.dmg.toFixed(0)} · Reichweite ${s.range.toFixed(0)} · alle ${s.rate.toFixed(2)} s</small>
          <div class="btnrow">${t.level < 3 ? `<button class="btn acc" data-act="gUp" ${G.coins >= uc ? '' : 'disabled'}>⬆️ Verbessern (${uc} 🪙)</button>` : '<span class="pill">Max. Stufe</span>'}<button class="btn ghost" data-act="gSell">Verkaufen (+${Math.round(t.spent*0.5)} 🪙)</button></div></div>`;
      }
    }
    h = panel || `<div class="ghint">Bauphase: Tippe auf einen Bauplatz (+), um einen Turm zu bauen, oder auf einen Turm, um ihn zu verbessern. Dann oben „Welle starten“.</div>`;
  }
  el.innerHTML = h;
}
function gameTap(ev){
  const G = S.play; if (!G || G.phase !== 'build' || G.q) return;
  const cv = ev.currentTarget, r = cv.getBoundingClientRect();
  const x = (ev.clientX - r.left) / r.width * GW, y = (ev.clientY - r.top) / r.height * GH;
  let hit = null;
  SLOTS.forEach(([sx,sy], i) => { if (Math.hypot(sx-x, sy-y) < 38) hit = i; });
  G.sel = hit; renderGameUI();
}

Object.assign(A, {
  gStart: () => { const m = S.play ? S.play.m : S.modules.find(x => x.id === S.gameMod); if (m) gameStart(m); },
  gExit: () => { S.play = null; go('game'); },
  gQuit: () => { const G = S.play; if (G && !G.over){ G.lives = 0; gameOver(); } else { S.play = null; go('game'); } },
  gSpeed: () => { const G = S.play; if (G){ G.speed = G.speed === 1 ? 2 : 1; renderGameUI(); } },
  gWave: () => gameStartWave(),
  gDesel: () => { if (S.play){ S.play.sel = null; renderGameUI(); } },
  gBuy: d => { const G = S.play, b = TOWERS[d.k]; if (!G || G.sel === null || G.coins < b.cost || !towerUnlocked(d.k)) return;
    G.coins -= b.cost; G.towers.push({ type:d.k, slot:G.sel, pos:SLOTS[G.sel], level:1, cd:0, spent:b.cost }); renderGameUI(); },
  gUp: () => { const G = S.play, t = G && G.towers.find(t => t.slot === G.sel); if (!t || t.level >= 3) return; const c = upCost(t); if (G.coins < c) return;
    G.coins -= c; t.spent += c; t.level++; renderGameUI(); },
  gSell: () => { const G = S.play, t = G && G.towers.find(t => t.slot === G.sel); if (!t) return; G.coins += Math.round(t.spent*0.5); G.towers = G.towers.filter(x => x !== t); renderGameUI(); },
  gAns: d => { const G = S.play; if (G && G.q) pickAnswer(G.q, +d.j, G.m); },
  gCheck: () => { const G = S.play; if (G && G.q) finishAnswer(G.q, G.q.sel.slice(), G.m); },
  gNext: () => gameCloseQuestion(),
});

app.addEventListener('change', e => {
  if (e.target.id !== 'restore' || !e.target.files[0]) return;
  const fr = new FileReader();
  fr.onload = () => {
    try { const data = JSON.parse(fr.result); if (!data || typeof data.q !== 'object') throw 0;
      P = mergeP(normP(data), P); save(); S.toast = '<span class="c">✅</span> Backup geladen!'; render();
    } catch(err){ S.toast = '<span class="c">⚠️</span> Datei ist kein Backup'; render(); }
  };
  fr.readAsText(e.target.files[0]);
});
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = A[el.dataset.act]; if (f) f(el.dataset);
});

/* ---------- confetti ---------- */
function confetti(){
  const c = document.getElementById('confetti'), x = c.getContext('2d');
  c.width = innerWidth*devicePixelRatio; c.height = innerHeight*devicePixelRatio; x.scale(devicePixelRatio, devicePixelRatio);
  const cols = ['#E10600','#FFFFFF','#FF4545','#7A0000','#2FBF71'];
  const ps = Array.from({length:140}, () => ({ x:innerWidth/2 + (Math.random()-.5)*200, y:innerHeight*0.35, vx:(Math.random()-.5)*14, vy:-Math.random()*14-4, s:6+Math.random()*7, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:rand(cols) }));
  const t0 = performance.now();
  (function frame(t){
    x.clearRect(0,0,innerWidth,innerHeight);
    ps.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); x.restore(); });
    if (t - t0 < 3200) requestAnimationFrame(frame); else x.clearRect(0,0,innerWidth,innerHeight);
  })(t0);
}

render();
init();
})();
</script>
