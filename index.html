<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kopfsache">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="apple-touch-icon" href="touch-icon-2.png">
<link rel="icon" href="app-icon-192-2.png">
<meta name="theme-color" content="#0C0C0E">
<meta name="robots" content="noindex, nofollow">
<title>Kopfsache – Lern-App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C0C0E; --card:#17171A; --card2:#1F1F23; --ink:#F6F4F1; --muted:#9B9AA3; --line:#2C2C32;
  --ok:#2FBF71; --okbg:rgba(47,191,113,.14); --bad:#FF4545; --badbg:rgba(255,69,69,.14); --open:#3A3A41;
  --acc:#E10600; --accsoft:rgba(225,6,0,.16);
  --r:24px; --shadow:inset 0 1px 0 rgba(255,255,255,.04),0 10px 30px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overscroll-behavior:none;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:18px;line-height:1.55}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque",Nunito,sans-serif;letter-spacing:-.02em;margin:0}
.wrap{max-width:880px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(80px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left))}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px;min-height:44px}
.back{display:inline-flex;align-items:center;gap:6px;padding:10px 16px 10px 12px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:16px}
.back:active{transform:scale(.97)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--card);font-weight:700;font-size:14px;color:var(--muted);box-shadow:var(--shadow)}
.note{background:rgba(225,6,0,.15);border-radius:14px;padding:10px 14px;font-size:15px;margin-bottom:16px}

/* Welcome */
.welcome{position:fixed;inset:0;background:#000;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;z-index:0}
.welcome::before{content:"";position:absolute;z-index:0;pointer-events:none;top:calc(52px + env(safe-area-inset-top));bottom:calc(52px + env(safe-area-inset-bottom));left:calc(52px + env(safe-area-inset-left));right:calc(52px + env(safe-area-inset-right));border:4px solid var(--acc);border-radius:36px;box-shadow:0 0 40px rgba(225,6,0,.25), inset 0 0 40px rgba(225,6,0,.12)}
.welcome>*:not(.blob){position:relative;z-index:1;flex-shrink:0}
.logo{width:clamp(64px,12vh,110px);height:clamp(64px,12vh,110px);font-size:clamp(34px,6.5vh,56px) !important;border-radius:30%;background:var(--acc);display:grid;place-items:center;transform:rotate(-6deg);box-shadow:0 18px 50px rgba(225,6,0,.45);margin-bottom:clamp(14px,3vh,28px);animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:rotate(-2deg) translateY(-6px)}}
.logo img{width:100%;height:100%;display:block}
.welcome .ver{position:absolute!important;bottom:calc(64px + env(safe-area-inset-bottom));left:0;right:0;font-size:12px;font-weight:700;color:#55545C}
.welcome h1{margin-bottom:clamp(18px,4vh,36px)}
.hello{font-weight:800;color:var(--muted);font-size:20px;margin:0 0 6px}
.welcome h1{font-size:clamp(44px,min(10vw,9vh),92px);font-weight:800;line-height:.95}
.welcome .sub{color:var(--muted);font-size:clamp(15px,2.2vh,19px);max-width:440px;margin:clamp(8px,2vh,18px) auto clamp(14px,3vh,30px)}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:clamp(16px,3.5vh,34px)}
.chip{background:var(--card);border-radius:16px;padding:clamp(8px,1.4vh,12px) 18px;box-shadow:var(--shadow);text-align:left}
.chip b{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:26px;line-height:1.1}
.chip span{font-size:14px;color:var(--muted);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--acc);color:#fff;font-weight:800;padding:16px 28px;border-radius:18px;font-size:18px;min-height:56px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.big{font-size:21px;padding:20px 44px;border-radius:22px}
.btn.acc{background:var(--acc)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btnrow{display:flex;gap:12px;flex-wrap:wrap}

/* Home */
.h-title{font-size:40px;font-weight:800;margin:6px 0 4px}
.h-sub{color:var(--muted);margin:0 0 26px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.wrap.wide{max-width:1140px}
.subjgrid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:0 22px;grid-auto-flow:row dense;align-items:stretch}
.subjgrp{display:flex;flex-direction:column}
.subjgrp .grid{grid-template-columns:1fr;gap:22px;flex:1}
.subjgrp.wide{grid-column:1/-1}
.subjgrp.wide .grid{grid-template-columns:repeat(var(--cols,3),minmax(0,1fr))}
@media (max-width:640px){.subjgrid,.subjgrp.wide .grid{grid-template-columns:1fr}}
.subjgrp .grid{height:100%}
.mcard{background:var(--card);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;transition:transform .15s}
.mcard:active{transform:scale(.98)}
.mcard{cursor:pointer;-webkit-tap-highlight-color:transparent}
.mtop{display:flex;align-items:center;gap:14px}
.mtop .memo{width:60px;height:60px;border-radius:12px;flex:none;font-size:30px}
.upd{flex:1;min-width:0;overflow:hidden;height:60px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;border-radius:12px;background:var(--accsoft);color:#fff;line-height:1.2}
.upd.empty{background:transparent}
.updic{flex:none;font-size:28px;font-weight:700;color:#fff;line-height:1}
.updt{min-width:0}
.upd b{display:block;font-size:12px;font-weight:800;color:#fff;white-space:nowrap}.upd.fresh b{color:var(--gold)}
.upd small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11px;font-weight:700;color:rgba(255,255,255,.85);margin-top:2px}
.calw{position:relative;display:flex;align-items:center;gap:10px;flex:none;padding:0;border-radius:14px;cursor:pointer}
.calw:active{opacity:.8}
.cal{width:60px;height:60px;border-radius:12px;overflow:hidden;background:#fff;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.35);flex:none;line-height:1;display:flex;flex-direction:column}
.cal i{display:block;background:var(--acc);color:#fff;font-style:normal;font-size:11px;font-weight:800;letter-spacing:.06em;padding:4px 0}
.cal b{flex:1;display:grid;place-items:center;color:#111;font-size:26px;font-weight:800}
.cd{font-weight:800;font-size:14px;color:var(--ink);line-height:1.15;text-align:left;max-width:120px}.cd small{display:block;color:var(--muted);font-size:11px;font-weight:700}
@media (max-width:900px){.upd{flex-direction:column;gap:3px;padding:0 6px;overflow:hidden}.updic{font-size:22px}.upd small,.upd .lbl{display:none}.upd b{font-size:11px}.mtop{gap:10px}.cd{font-size:13px;max-width:96px}}
.cd.hot{color:var(--acc)}
.exin{display:block;width:100%;margin-top:6px;background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px;font-weight:700;-webkit-appearance:none;appearance:none;min-height:48px;box-sizing:border-box}
.exin::-webkit-calendar-picker-indicator{filter:invert(1)}
.mdue{color:var(--gold)}
.bigprog{display:block;position:relative;width:100%;font-weight:700;color:var(--muted);padding-bottom:10px}.bigprog b{color:var(--ink)}.bigprog i{position:absolute;left:0;bottom:0;height:5px;border-radius:3px;background:var(--acc)}
.tile.locked{opacity:.75;border:2px dashed var(--line)}
.pzbar{border-color:var(--gold)}
.pzlevels{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 18px}
.pzgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.pzcard{background:var(--card);border:2px solid transparent;border-radius:18px;padding:10px 10px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.pzcard.ok{border-color:#2FBF71}
.pzthumb{display:block;border-radius:12px;overflow:hidden;pointer-events:none}.pzthumb svg{width:100%;height:auto;display:block}
.pzcap{font-weight:800;font-size:14px;line-height:1.25}.pzcard small{color:var(--muted);font-weight:700;font-size:12px}
.pztitle{font-size:20px;margin:4px 0 12px}
.pzfig{background:var(--card);border-radius:20px;padding:8px;border:3px solid var(--acc)}.pzfig svg{width:100%;height:auto;display:block}
.pzchips{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.pzchip{background:#000;border:2px solid var(--acc);color:var(--ink);border-radius:14px;padding:10px 14px;font-weight:800;font-size:15px;text-align:left}
.pzchip.on{background:var(--acc);border-color:#fff;transform:scale(1.04)}
.pzdone{margin-top:16px;background:#000;border:2px solid #2FBF71;border-radius:var(--r);padding:16px 18px}.pzdone b{display:block;font-size:20px;margin-bottom:10px}
.pzhint{font-size:13px;margin-top:10px}
.duebar{width:100%;display:flex;align-items:center;gap:14px;text-align:left;padding:16px 20px;margin:0 0 18px;border-radius:var(--r);background:#000;border:2px solid var(--acc);color:var(--ink)}
.duebar.ok{border-color:var(--line);background:var(--card)}
.duebar .di{font-size:30px}.duebar .dt{flex:1;font-weight:800;font-size:18px}.duebar .dt small{display:block;color:var(--muted);font-size:13px;font-weight:700}
.duebar .dgo{background:var(--acc);color:#fff;border-radius:999px;padding:9px 16px;font-weight:800;font-size:15px;white-space:nowrap}
.nag{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#000;border:2px solid var(--gold);border-radius:var(--r);padding:14px 18px;margin:0 0 22px}
.nag .ni{font-size:28px}.nag .nt{flex:1;min-width:220px;font-weight:800}.nag .nt small{display:block;color:var(--muted);font-weight:700;font-size:13px}
.mcard::before{content:"";position:absolute;inset:0 0 auto 0;height:12px;background:var(--acc)}
.memo{width:56px;height:56px;border-radius:18px;background:var(--accsoft);display:grid;place-items:center;font-size:30px}
.mcard h2{font-size:24px;font-weight:700}
.mcard p{margin:0;color:var(--muted);font-size:15px;line-height:1.4}
.meta{display:flex;gap:14px;font-size:14px;font-weight:700;color:var(--muted)}
.bar{height:10px;border-radius:99px;background:#2A2A30;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.empty{background:var(--card);border:2px dashed var(--line);border-radius:var(--r);padding:34px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:20px;margin-bottom:6px}

/* Module */
.hero{background:var(--acc);color:#fff;border-radius:30px;padding:30px;display:flex;gap:20px;align-items:center;margin-bottom:22px;position:relative;overflow:hidden}
.hero .memo{background:rgba(255,255,255,.2);width:72px;height:72px;font-size:40px;border-radius:22px;flex:none}
.hero h1{font-size:36px;font-weight:800;line-height:1.05}
.hero p{margin:6px 0 0;opacity:.85;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:640px){.tiles{grid-template-columns:1fr}}
.tile{background:var(--card);border-radius:var(--r);padding:24px 22px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:6px;min-height:190px;transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile .ic{font-size:38px;margin-bottom:auto}
.tiles.four{grid-template-columns:repeat(2,1fr)}
@media (max-width:640px){.tiles.four{grid-template-columns:1fr}}
.tile.examtile{background:linear-gradient(135deg,#3A0E0C,var(--card) 70%);box-shadow:var(--shadow),inset 0 0 0 2px var(--acc)}
.pill.clock{color:var(--ink);font-variant-numeric:tabular-nums}
.pill.clock.warn{color:#FFC83D}
.pill.clock.late{color:#fff;background:var(--bad)}
.tile h3{font-size:24px;font-weight:700}
.tile span{color:var(--muted);font-weight:700;font-size:15px}
.hist{background:var(--card);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);margin-top:18px}
.hist h3{font-size:18px;margin-bottom:14px}
.hbars{display:flex;align-items:flex-end;gap:10px;height:110px}
.hb{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;max-width:70px}
.hb i{width:100%;border-radius:10px 10px 4px 4px;background:var(--acc);min-height:4px}
.hb i.low{background:#55555D}
.hb small{font-weight:800;font-size:13px;color:var(--muted)}

/* Lists */
.list{display:flex;flex-direction:column;gap:12px}
.row{background:var(--card);border-radius:20px;padding:18px 20px;box-shadow:var(--shadow);display:flex;align-items:center;gap:16px;text-align:left;width:100%;transition:transform .12s}
.row:active{transform:scale(.99)}
.num{width:44px;height:44px;border-radius:14px;background:var(--accsoft);color:var(--acc);display:grid;place-items:center;font-weight:800;font-family:"Bricolage Grotesque",system-ui,sans-serif;flex:none}
.num.done{background:var(--okbg);color:var(--ok)}
.row .t{flex:1;font-weight:700}
.row .t small{display:block;color:var(--muted);font-weight:600;font-size:14px}

/* Lesson */
.article{background:var(--card);border-radius:28px;padding:34px clamp(22px,5vw,48px);box-shadow:var(--shadow);font-size:19px;line-height:1.7}
.article h1{font-size:34px;font-weight:800;margin-bottom:18px;line-height:1.1}
.article h3{font-size:23px;margin:28px 0 8px}
.article p{margin:0 0 14px}
.article ul{margin:0 0 16px;padding-left:24px}
.article li{margin-bottom:6px}
.article li.sub{margin-left:22px;list-style:circle}
.article li.num{list-style:none;margin-left:-20px}
.tblwrap{overflow-x:auto;margin:6px 0 18px}
.tbl{border-collapse:collapse;width:100%;font-size:15px}
.qctx{background:rgba(255,255,255,.04);border-left:3px solid var(--acc);border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:14.5px;line-height:1.5;color:var(--muted)}
.qctx p{margin:0 0 6px}
.tbl th{background:var(--acc);color:#fff;text-align:left;padding:8px 10px;font-weight:800}
.tbl td{padding:8px 10px;border-bottom:1px solid #34343B;vertical-align:top}
.tbl tr:nth-child(even) td{background:rgba(255,255,255,.03)}
.article code{background:#2A2A30;padding:2px 6px;border-radius:6px;font-size:.9em}
.merke{background:var(--accsoft);border-left:5px solid var(--acc);border-radius:14px;padding:14px 18px;margin:18px 0;font-weight:600}
.sect{display:flex;align-items:center;gap:12px;margin:36px 0 16px}
.sect h2{font-size:26px;font-weight:800}

/* Question */
.qcard{background:var(--card);border-radius:28px;padding:28px;box-shadow:var(--shadow);margin-bottom:18px;position:relative}
.qedit{position:absolute;top:14px;right:14px;width:42px;height:42px;border-radius:50%;background:var(--card2);font-size:18px;display:flex;align-items:center;justify-content:center}
.qcard:has(.qedit) .qhead{padding-right:50px}
.edov{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.78);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top)) 14px 60px}
body.edopen{overflow:hidden}
.edcard{background:var(--card);border-radius:24px;padding:22px;width:min(760px,100%);box-shadow:0 20px 60px rgba(0,0,0,.6)}
.edtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.edtop h2{margin:0;font-size:22px}.edtop .gx{position:static}
.edl{display:block;font-weight:800;margin:14px 0 6px}.edl small{display:block;color:var(--muted);font-weight:600;font-size:13px;margin:2px 0 6px}
.edcard textarea,.edcard .edopt{width:100%;background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;font-weight:600;resize:vertical}
.edrow{display:flex;gap:10px;align-items:center;margin-bottom:8px}.edrow .edok{width:26px;height:26px;flex:none;accent-color:#2FBF71}
.ederr{color:#FF6B6B;font-weight:800;margin-top:12px}
.edinfo{color:var(--muted);font-weight:700}
.edfoot{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.btn.danger{background:#3A1414;color:#FF8A8A}
.edli{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.edli small{display:block;color:var(--muted);font-weight:700;font-size:12px}.edli b{font-size:14px;font-weight:700}.edli .btn{flex:none}
.qhead{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--acc);margin-bottom:8px}
.qtext{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:clamp(23px,3.4vw,29px);font-weight:700;line-height:1.25;margin-bottom:22px}
.qtext .not{background:var(--badbg);color:var(--bad);padding:0 6px;border-radius:6px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:16px 18px;border-radius:18px;border:2px solid var(--line);background:var(--card2);font-weight:700;font-size:18px;min-height:64px;transition:transform .1s,border-color .15s,background .15s}
.opt:active{transform:scale(.99)}
.opt .l{width:36px;height:36px;border-radius:11px;background:#2C2C32;display:grid;place-items:center;font-weight:800;flex:none;font-family:"Bricolage Grotesque"}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg);animation:shake .35s}
.opt.bad .l{background:var(--bad);color:#fff}
.opt.dim{opacity:.45}
.opts.locked .opt{pointer-events:none}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:18px;border-radius:18px;padding:16px 18px;font-size:17px}
.fb.ok{background:var(--okbg)}
.fb.bad{background:var(--badbg)}
.fb b{display:block;font-size:19px;margin-bottom:2px}
.prog{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.prog .bar{flex:1;height:12px}
.prog .bar i{background:var(--acc);transition:width .4s}
.prog b{font-weight:800;min-width:64px;text-align:right}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--open)}
.dots i.ok{background:var(--ok)} .dots i.bad{background:var(--bad)} .dots i.cur{outline:3px solid var(--acc);outline-offset:2px}
.sticky{position:sticky;bottom:16px;display:flex;justify-content:flex-end;margin-top:18px}

/* Result */
.result{text-align:center;padding-top:10px}
.ringwrap{position:relative;width:220px;height:220px;margin:10px auto 18px}
.ringwrap .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:58px;font-weight:800}
.result h1{font-size:34px;font-weight:800}
.result .sub{color:var(--muted);font-weight:600;margin:6px 0 26px}
.badge{display:inline-block;padding:6px 14px;border-radius:999px;font-weight:800;font-size:15px;margin-bottom:12px}

<body>
<div id="app"></div>
<canvas id="confetti"></canvas>
<script>
(function(){
"use strict";
const app = document.getElementById('app');
const APP_VERSION = '40';
const LS_P = 'kopfsache.progress.v1', LS_M = 'kopfsache.modules.v1';
const NAME = 'Fabian';

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rand = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick = (a,n) => shuffle(a).slice(0,n);
const fmtDay = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
const clone = o => JSON.parse(JSON.stringify(o));

function figHtml(m, id){
  const f = m && m.figures && m.figures[id]; if (!f) return '';
  return '<figure class="fig">' + f.svg + (f.caption ? '<figcaption>' + esc(f.caption) + '</figcaption>' : '') + '</figure>';
}
function md(t, m){
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>');
  let html='', list=false, para=[], merke=[], table=[];
  const flushP=()=>{ if(para.length){ html+='<p>'+inline(para.join(' '))+'</p>'; para=[]; } };
  const closeL=()=>{ if(list){ html+='</ul>'; list=false; } };
  const flushM=()=>{ if(merke.length){ html+='<div class="merke">'+merke.map(inline).join('<br>')+'</div>'; merke=[]; } };
  const flushT=()=>{ if(!table.length) return;
    const rows = table.filter(r => !/^\|[\s:|-]+\|$/.test(r)).map(r => r.replace(/^\||\|$/g,'').split('|').map(c => c.trim()));
    html += '<div class="tblwrap"><table class="tbl">' + rows.map((r,i) => '<tr>' + r.map(c => i===0 ? '<th>'+inline(c)+'</th>' : '<td>'+inline(c)+'</td>').join('') + '</tr>').join('') + '</table></div>';
    table=[]; };
  const flushAll=()=>{ flushP(); closeL(); flushM(); flushT(); };
  let inCode = false, codeBuf = [];
  for (const raw of String(t||'').split('\n')){
    if (raw.trim().startsWith('```')){
      if (inCode){ html += '<pre class="code">' + esc(codeBuf.join('\n')) + '</pre>'; codeBuf = []; inCode = false; }
      else { flushAll(); inCode = true; }
      continue;
    }
    if (inCode){ codeBuf.push(raw); continue; }
    const l = raw.trim();
    if (!l){ flushAll(); continue; }
    if (l.startsWith('|') && l.endsWith('|')){ flushP(); closeL(); flushM(); table.push(l); continue; }
    flushT();
    if (l.startsWith('> ')){ flushP(); closeL(); merke.push(l.slice(2)); continue; }
    flushM();
    const fm = l.match(/^\[\[fig:([\w-]+)\]\]$/);
    if (fm){ flushP(); closeL(); html += figHtml(m, fm[1]); continue; }
    if (l.startsWith('## ')){ flushP(); closeL(); html+='<h3>'+inline(l.slice(3))+'</h3>'; continue; }
    if (/^[-•] /.test(l)){ flushP(); if(!list){ html+='<ul>'; list=true; } html+='<li'+(/^\s{2,}/.test(raw)?' class="sub"':'')+'>'+inline(l.slice(2))+'</li>'; continue; }
    if (/^\d+\. /.test(l)){ flushP(); if(!list){ html+='<ul>'; list=true; } html+='<li class="num">'+inline(l)+'</li>'; continue; }
    closeL(); para.push(l);
  }
  flushAll(); return html;
}

/* ---------- state ---------- */
let P = normP(lsGet(LS_P));
let S = { view:'welcome', raw: (lsGet(LS_M)||[]), modules: [], semesters: (lsGet(LS_M+'.sem')||[]), sem: null, contentDate: lsGet(LS_M+'.date')||'', modId:null, lessonId:null, lq:[], test:null, filter:'all', note:null, confirmQuit:false };
S.modules = applyEdits(S.raw);
/* ---------- eigene Änderungen an Fragen (liegen getrennt vom Stoff, überleben jedes Update) ---------- */
function applyEdits(mods){
  const E = (P && P.edits) || {};
  if (!Object.keys(E).length) return mods;
  return mods.map(m => {
    if (!(m.questions||[]).some(q => E[m.id+'::'+q.id])) return m;
    const qs = [];
    for (const q of m.questions){ const e = E[m.id+'::'+q.id]; if (!e){ qs.push(q); continue; } if (e.del) continue; qs.push(Object.assign({}, q, e.q || {}, { edited:true })); }
    return Object.assign({}, m, { questions: qs });
  });
}
function normP(p){ p = p && typeof p==='object' ? p : {}; return { q:p.q||{}, lessons:p.lessons||{}, tests:Array.isArray(p.tests)?p.tests:[], days:p.days||{}, puzzles: p.puzzles && typeof p.puzzles==='object' ? p.puzzles : {}, pzLevel: p.pzLevel || 6, exams: p.exams && typeof p.exams==='object' ? p.exams : {}, lastBackup:+p.lastBackup||0, backupSnooze:+p.backupSnooze||0, edits: p.edits && typeof p.edits==='object' ? p.edits : {}, cw: normCw(p.cw), coins:+p.coins||0, run:+p.run||0, ct:+p.ct||0, game: normGame(p.game) }; }
function normCw(c){ c = c && typeof c==='object' ? c : {}; const o = x => x && typeof x==='object' ? x : {}; return { s:o(c.s), t:o(c.t), code:o(c.code) }; }
function normGame(g){ g = g && typeof g==='object' ? g : {}; const st = g.stats||{}; return { best:g.best||{}, bonus:g.bonus||{}, saves: g.saves && typeof g.saves==='object' ? g.saves : {}, map: g.map||'wald', sound: g.sound !== false, stats:{ games:+st.games||0, waves:+st.waves||0, right:+st.right||0, wrong:+st.wrong||0, kills:+st.kills||0, bestStreak:+st.bestStreak||0 } }; }

const mod = () => S.modules.find(m => m.id===S.modId);
const key = (m,q) => m.id+'::'+q.id;
const status = (m,q) => (P.q[key(m,q)]||{}).last;
function stats(m){
  const qs = m.questions||[]; let ok=0, bad=0;
  qs.forEach(q => { const s=status(m,q); if(s==='r') ok++; else if(s==='w') bad++; });
  const n = qs.length, open = n-ok-bad;
  const pc = x => n ? Math.round(x/n*100) : 0;
  return { n, ok, bad, open, pOk:pc(ok), pBad:pc(bad), pOpen: n ? 100-pc(ok)-pc(bad) : 0 };
}
/* ---------- Wiederholen mit Abständen (Lernkartei): richtig → Kasten hoch, falsch → zurück auf Kasten 0 ---------- */
const DAY = 864e5, SR_DAYS = [0, 1, 3, 7, 16, 35];
function srBox(e){ return e.b != null ? e.b : (e.last === 'r' ? 1 : 0); }
function srDue(e){ if (e.due != null) return e.due; return (e.t||0) + SR_DAYS[srBox(e)] * DAY; }
const endOfToday = () => { const d = new Date(); d.setHours(23,59,59,999); return d.getTime(); };
const isDue = (m,q) => { const e = P.q[key(m,q)]; return !!e && srDue(e) <= endOfToday(); };
const dueQs = m => (m.questions||[]).filter(q => isDue(m,q));
function nextDueDay(m){ let t = Infinity; for (const q of (m.questions||[])){ const e = P.q[key(m,q)]; if (e){ const d = srDue(e); if (d > endOfToday() && d < t) t = d; } } return t === Infinity ? 0 : t; }
function record(m,q,ok){
  const k = key(m,q), e = P.q[k] || {r:0,w:0};
  if (ok) e.r++; else e.w++;
  const box = ok ? Math.min(SR_DAYS.length - 1, (e.b != null ? e.b : (e.last === 'r' ? 1 : 0)) + 1) : 0;
  // falsch → morgen wieder fällig (heute über „Fehler üben“ jederzeit möglich), richtig → nach 1, 3, 7, 16, 35 Tagen
  e.b = box; e.due = ok ? Date.now() + SR_DAYS[box] * DAY : endOfToday() + 1;
  e.last = ok ? 'r' : 'w'; e.t = Date.now();
  P.q[k] = e;
  const d = fmtDay(new Date()); P.days[d] = (P.days[d]||0)+1;
  P.ct = Date.now();
  save();
}
function streak(){
  const d = new Date(); if (!P.days[fmtDay(d)]) d.setDate(d.getDate()-1);
  let n=0; while (P.days[fmtDay(d)]){ n++; d.setDate(d.getDate()-1); } return n;
}

/* ---------- question building (anti-auswendig) ---------- */
/* ---------- Rechenaufgaben mit Zufallszahlen ---------- */
const ri = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const r3 = x => (Math.round(x*1000)/1000).toFixed(3);
const root = n => { const s = Math.sqrt(n); return Number.isInteger(s) ? String(s) : '√' + n; };
const vec = v => '(' + v.join(', ') + ')';
function wrongs(correct, cands, fallback){
  const out = [], c = String(correct);
  for (const x of shuffle(cands.map(String))) { if (x !== c && !out.includes(x)) out.push(x); if (out.length === 3) break; }
  let k = 1;
  while (out.length < 3 && fallback) { const x = String(fallback(k++)); if (x !== c && !out.includes(x)) out.push(x); if (k > 50) break; }
  return out;
}
function bitsExplain(n){
  const parts = []; for (let p = 128; p >= 1; p /= 2) if (n & p) parts.push(p);
  return parts.join(' + ') + ' = ' + n;
}
const GEN = {
  bin2dec: { title:'Rechenaufgabe: Binärzahl → Dezimalzahl', make(){
    const n = ri(5, 250), b = n.toString(2).padStart(8,'0');
    const rev = parseInt(b.split('').reverse().join(''), 2);
    return { prompt:`Welche Dezimalzahl entspricht der Binärzahl ${b}?`, correct:String(n),
      wrong: wrongs(n, [n+1, n-1, rev, n+2, n^16, n^2, n+8, n-8].filter(x => x >= 0), k => n + 3*k),
      explain:`${b}: ${bitsExplain(n)}.` }; } },
  dec2bin: { title:'Rechenaufgabe: Dezimalzahl → Binärzahl', make(){
    const n = ri(5, 250), b = x => (x & 255).toString(2).padStart(8,'0');
    const rev = b(n).split('').reverse().join('');
    return { prompt:`Wie lautet die Zahl ${n} als 8-stellige Binärzahl?`, correct:b(n),
      wrong: wrongs(b(n), [b(n+1), b(n-1), rev, b(n^8), b(n^32), b(n^1)], k => b(n + 2*k)),
      explain:`${bitsExplain(n)} → ${b(n)}.` }; } },
  ascii: { title:'Rechenaufgabe: ASCII-Werte', make(){
    const kind = ri(0,2);
    let ch, code;
    if (kind === 0) { code = ri(65, 90); } else if (kind === 1) { code = ri(97, 122); } else { code = ri(48, 57); }
    ch = String.fromCharCode(code);
    if (Math.random() < 0.5) {
      return { prompt:`Welchen ASCII-Wert (dezimal) hat das Zeichen „${ch}“?`, correct:String(code),
        wrong: wrongs(code, [code+1, code-1, code+32, code-32, code+2], k => code + 3 + k),
        explain:`A = 65 … Z = 90, a = 97 … z = 122, „0“ = 48 … „9“ = 57. „${ch}“ = ${code}.` };
    }
    const alt = [code+1, code-1, code+32, code-32, code+2].filter(c => c >= 33 && c <= 126).map(c => String.fromCharCode(c));
    return { prompt:`Welches Zeichen hat den ASCII-Wert ${code}?`, correct:ch,
      wrong: wrongs(ch, alt, k => String.fromCharCode(33 + ((code + 5*k) % 90))),
      explain:`A = 65 … Z = 90, a = 97 … z = 122, „0“ = 48 … „9“ = 57. ${code} = „${ch}“.` };
  } },
  mod: { title:'Rechenaufgabe: MOD (Rest der Division)', make(){
    if (Math.random() < 0.5) {
      const n = ri(11, 99), r = n % 2;
      const opts = ['0 → gerade', '1 → ungerade', '0 → ungerade', '1 → gerade'];
      const c = r === 0 ? opts[0] : opts[1];
      return { prompt:`EVEN-OR-ODD(${n}): Was ergibt ${n} MOD 2 – und welche Ausgabe folgt?`, correct:c, wrong: opts.filter(o => o !== c),
        explain:`${n} : 2 = ${Math.floor(n/2)} Rest ${r} → ${r === 0 ? '"EVEN" (gerade)' : '"ODD" (ungerade)'}.` };
    }
    const b = ri(3, 9), a = ri(b+1, 60), r = a % b;
    return { prompt:`Was ergibt ${a} MOD ${b}?`, correct:String(r),
      wrong: wrongs(r, [Math.floor(a/b), r+1, b-r, r-1, a-b].filter(x => x >= 0), k => r + k + 1),
      explain:`${a} : ${b} = ${Math.floor(a/b)} Rest ${r}. MOD liefert den Rest.` };
  } },
  linsearch: { title:'Rechenaufgabe: Lineare Suche', make(){
    const n = ri(7, 10), set = new Set(); while (set.size < n) set.add(ri(1, 99));
    const A = [...set].sort((a,b) => a-b);
    const missing = Math.random() < 0.2;
    let x, idx;
    if (missing) { do { x = ri(1, 99); } while (set.has(x)); idx = 'NOT-FOUND'; }
    else { idx = ri(0, n-1); x = A[idx]; }
    const c = String(idx);
    const cands = missing ? ['0', String(n), String(n-1), '−1'] : [idx+1, idx-1, x, 'NOT-FOUND', n].filter(v => v !== -1).map(String);
    return { prompt:`LINEAR-SEARCH(A, ${n}, ${x}) mit A = [${A.join(', ')}]. Was gibt der Algorithmus zurück?`, correct:c,
      wrong: wrongs(c, cands, k => String(n + k)),
      explain: missing ? `${x} kommt nicht vor → answer bleibt NOT-FOUND.` : `${x} steht an Index ${idx} (Zählung ab 0) → answer = ${idx}.` };
  } },
  binfirst: { title:'Rechenaufgabe: Binäre Suche – Mitte', make(){
    const n = ri(6, 21), M = Math.floor((n-1)/2);

function buildQ(q, m){
  const fig = q.fig && m && m.figures && m.figures[q.fig] ? q.fig : null;
  if (Array.isArray(q.options) && Array.isArray(q.answers)) {
    // Originalfrage: Text, Code und Antworten unverändert, Reihenfolge wie im Original
    let options = q.options.map(String), answers = q.answers.slice();
    if (q.exam && !q.keep){
      // Prof-Fragen: Text wortgetreu, aber Reihenfolge gemischt (gegen Auswendiglernen); „Keine der …“ bleibt am Ende
      const idx = options.map((_,i) => i), tail = idx.filter(i => /^Keine der/i.test(options[i])), body = shuffle(idx.filter(i => !tail.includes(i))), order = body.concat(tail);
      answers = answers.map(a => order.indexOf(a)); options = order.map(i => options[i]);
    }
    return { prompt:q.prompt||'', code:q.code||'', options, answers, answer:answers[0], multi: answers.length>1 || !!q.multi,
             explain:q.explain||'', fig, original:!q.exam, exam:!!q.exam, src:q.src||'', mono:!!q.mono, ctx:q.ctx||'', figPre:!!q.figPre };
  }
  if (q.gen && GEN[q.gen]) {
    let g; try { g = GEN[q.gen].make(); } catch(e) { g = null; }
    if (g && g.correct != null && g.wrong && g.wrong.length) {
      const options = shuffle([String(g.correct), ...g.wrong.slice(0,3).map(String)]);
      const a = options.indexOf(String(g.correct));
      return { prompt:g.prompt, code:g.code||'', mono:!!g.mono, options, answer:a, answers:[a], inverse:!!g.inverse, explain: g.explain || q.explain || '', fig, gen:true };
    }
  }
  const corr = q.correct||[], wr = q.wrong||[];
  const inverse = Array.isArray(q.notPrompts) && q.notPrompts.length && corr.length>=3 && wr.length && Math.random()<0.3;
  let prompt, answer, others;
  if (inverse){ prompt = rand(q.notPrompts); answer = rand(wr); others = pick(corr,3); }
  else { prompt = rand(q.prompts && q.prompts.length ? q.prompts : ['?']); answer = rand(corr); others = pick(wr,3); }
  const options = shuffle([answer, ...others]);
  const a = options.indexOf(answer);
  return { prompt, code:q.code||'', mono:!!q.mono, options, answer:a, answers:[a], inverse:!!inverse, explain: q.explain||'', fig };
}
function selectQs(m, mode, n){
  n = n || 10;
  const isExam = mode==='exam' || mode==='examWrong';
  const qs = isExam ? examQs(m) : (m.questions||[]), st = q => status(m,q);
  if (mode==='examWrong') return shuffle(qs.filter(q => st(q)==='w')).slice(0,n);
  if (mode==='wrong') return shuffle(qs.filter(q => st(q)==='w')).slice(0,n);
  if (mode==='open')  return shuffle(qs.filter(q => !st(q))).slice(0,n);
  if (mode==='right') return shuffle(qs.filter(q => st(q)==='r')).slice(0,n);
  const byDue = arr => arr.map(q => ({ q, t: srDue(P.q[key(m,q)]) + Math.random()*36e5*6 })).sort((a,b) => a.t-b.t).map(x => x.q);
  if (mode==='due') return shuffle(byDue(qs.filter(q => isDue(m,q))).slice(0,n));
  const wrong = shuffle(qs.filter(q => st(q)==='w'));
  const open  = shuffle(qs.filter(q => !st(q)));
  const dueRight = byDue(qs.filter(q => st(q)==='r' && isDue(m,q)));
  const right = byDue(qs.filter(q => st(q)==='r' && !isDue(m,q)));
  const want = Math.min(wrong.length, Math.ceil(n*0.4));
  const out = wrong.slice(0,want);
  for (const arr of [dueRight, open, right, wrong.slice(want)]) for (const q of arr){ if (out.length>=n) break; out.push(q); }
  return shuffle(out);
}

}

function mergeP(a, b){
  const out = normP(clone(a)); b = normP(b);
  for (const k in b.q){ if (!out.q[k] || (b.q[k].t||0) > (out.q[k].t||0)) out.q[k] = b.q[k]; }
  Object.assign(out.lessons, b.lessons);
  Object.assign(out.exams, b.exams); for (const k in b.cw.s) out.cw.s[k] = Math.max(out.cw.s[k] ?? -1, b.cw.s[k]); for (const k in b.cw.t) out.cw.t[k] = Math.max(out.cw.t[k] || 0, b.cw.t[k]); for (const k in b.cw.code) if (out.cw.code[k] == null) out.cw.code[k] = b.cw.code[k]; Object.assign(out.puzzles, b.puzzles); out.lastBackup = Math.max(out.lastBackup||0, b.lastBackup||0);
  for (const k in b.edits){ if (!out.edits[k] || (b.edits[k].t||0) > (out.edits[k].t||0)) out.edits[k] = b.edits[k]; }
  const seen = new Set(out.tests.map(t => t.t));
  b.tests.forEach(t => { if (!seen.has(t.t)) out.tests.push(t); });
  out.tests.sort((x,y) => x.t-y.t); out.tests = out.tests.slice(-150);
  for (const d in b.days) out.days[d] = Math.max(out.days[d]||0, b.days[d]);
  if ((b.ct||0) > (out.ct||0)){ out.coins=b.coins; out.run=b.run; out.ct=b.ct; }
  const ga = out.game, gb = b.game;
  for (const k in gb.best){ const x = ga.best[k], y = gb.best[k]; if (!x || (y.wave||0) > (x.wave||0) || ((y.wave||0) === (x.wave||0) && (y.score||0) > (x.score||0))) ga.best[k] = y; }
  Object.assign(ga.bonus, gb.bonus);
  for (const k in gb.saves){ if (!ga.saves[k] || (gb.saves[k].t||0) > (ga.saves[k].t||0)) ga.saves[k] = gb.saves[k]; }
  for (const k in gb.stats) ga.stats[k] = Math.max(ga.stats[k]||0, gb.stats[k]||0);
  return out;
}

const PZ_LEVELS = [[4,'Leicht · 4'],[6,'Mittel · 6'],[99,'Schwer · alle']];
const pzKey = s => String(s).replace(/ /g,' ').replace(/\s+/g,' ').trim();
function pzCandidates(svgText){
  const doc = new DOMParser().parseFromString(svgText, 'image/svg+xml');
  return [...doc.querySelectorAll('text')].map((t,i) => ({ i, key: pzKey([...t.querySelectorAll('tspan')].map(x => x.textContent).join(' ') || t.textContent) }))

}
function pzNew(mid, fid){

  const cands = pzCandidates(m.figures[fid].svg), seen = new Set();
  const uniq = shuffle(cands).filter(c => !seen.has(c.key) && seen.add(c.key));
  const pick = uniq.slice(0, Math.min(P.pzLevel, uniq.length)).sort((a,b) => a.i - b.i);
  S.pz = { mid, fid, slots: pick.map(c => ({ i:c.i, key:c.key, placed:null, ok:null })), chips: shuffle(pick.map((c,j) => ({ id:j, i:c.i, key:c.key }))), sel:null, errors:0, done:false };

function pzDom(){
  const z = S.pz, box = document.getElementById('pzfig'); if (!z || !box) return;
  const svg = box.querySelector('svg'), texts = [...svg.querySelectorAll('text')], NS = 'http://www.w3.org/2000/svg';
  const vb = svg.viewBox.baseVal, k0 = (vb && vb.width ? vb.width : 760) / 760;
  const layer = document.createElementNS(NS, 'g'); svg.appendChild(layer);
  const set = (el, o) => Object.entries(o).forEach(([a,v]) => el.setAttribute(a, v));
  // Alle leeren Lücken gleich groß – die Größe darf nicht verraten, welche Karte hineingehört
  const EW = 92 * k0, EH = 32 * k0;
  z.slots.forEach((s, k) => {
    const t = texts[s.i]; if (!t) return;
    const bb = t.getBBox(); t.style.visibility = 'hidden';
    const cx = bb.x + bb.width/2, cy = bb.y + bb.height/2;
    const g = document.createElementNS(NS, 'g'); set(g, { 'data-act':'pzSlot', 'data-s':k }); g.style.cursor = 'pointer';
    const r = document.createElementNS(NS, 'rect'); g.appendChild(r); layer.appendChild(g);   // erst einhängen, sonst liefert getBBox() 0
    const stroke = s.ok === true ? '#2FBF71' : s.ok === false ? '#FF4545' : (z.sel !== null ? '#FFC83D' : '#E10600');
    if (s.placed !== null){
      const chip = z.chips.find(c => c.id === s.placed), cl = texts[chip.i].cloneNode(true);
      cl.style.visibility = 'visible';
      if (s.ok === true) cl.setAttribute('fill', '#2FBF71');
      g.appendChild(cl);
      const cb = cl.getBBox(), maxW = (vb && vb.width ? vb.width : 760) - 16 * k0, sc = Math.min(1, maxW / (cb.width + 16 * k0));
      const w = (cb.width + 16 * k0) * sc, h = (cb.height + 10 * k0) * sc;
      // im Bild halten: lange Karten nicht über den Rand hinausschieben
      const vx = vb && vb.width ? vb.x : 0, vw = vb && vb.width ? vb.width : 760, px = Math.min(Math.max(cx, vx + 6*k0 + w/2), vx + vw - 6*k0 - w/2);
      cl.setAttribute('transform', `translate(${px} ${cy}) scale(${sc}) translate(${-(cb.x + cb.width/2)} ${-(cb.y + cb.height/2)})`);
      set(r, { x: px - w/2, y: cy - h/2, width: w, height: h, rx: 10 * k0, fill: '#1C1C22', stroke, 'stroke-width': 3 * k0 });
    } else {
      set(r, { x: cx - EW/2, y: cy - EH/2, width: EW, height: EH, rx: 10 * k0, fill: '#0B0B0E', stroke, 'stroke-width': 3 * k0, 'stroke-dasharray': `${7*k0} ${5*k0}` });
      const n = document.createElementNS(NS, 'text');
      set(n, { x: cx, y: cy + 1, 'text-anchor':'middle', 'dominant-baseline':'middle', 'font-size': 15 * k0, 'font-weight': 800, fill: '#E10600' });
      n.textContent = '?'; g.appendChild(n);
    }
  });
}

const STACKS = { open:['Unbeantwortet','st-open'], ok:['Richtig','st-ok'], bad:['Falsch','st-bad'] };
function stacksHtml(m){
  const st = stats(m), n = st.n || 1;
  const one = (k, count, pct) => {
    const L = count ? Math.min(9, Math.max(1, Math.ceil(count/n*9))) : 0;
    let cards = '';
    for (let i=0;i<L;i++){
      const top = i===L-1, rot = top ? 0 : ((i%2?1:-1)*(1+i%3));
      cards += `<div class="card ${top?'top':''}" style="bottom:${i*7}px;transform:rotate(${rot}deg)">${top?`<b>${count}</b><span>${STACKS[k][0]}</span>`:''}</div>`;
    }
    if (!L) cards = `<div class="card empty" style="bottom:0">leer</div>`;
    return `<button class="stack ${STACKS[k][1]}" data-act="stack" data-k="${k}"><div class="pile">${cards}</div><div class="lbl">${STACKS[k][0]}<small>${pct} %</small></div></button>`;
  };
  return `<div class="stacks">${one('open',st.open,st.pOpen)}${one('ok',st.ok,st.pOk)}${one('bad',st.bad,st.pBad)}</div>`;
}

async function shareJson(obj, name, title){
  const blob = new Blob([JSON.stringify(obj, null, 1)], { type:'application/json' });
  try {
    const file = new File([blob], name, { type:'application/json' });
    if (navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], title }); return true; }
  } catch(e){ if (e && e.name==='AbortError') return false; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  return true;
}

/* ---------- Fragen-Editor ---------- */
let ED = null;
function openEditor(mid, qid){
  const m = S.modules.find(x => x.id === mid), cur = m && (m.questions||[]).find(q => q.id === qid);
  if (!cur){ toast('<span class="c">⚠️</span> Frage nicht gefunden'); return; }
  ED = { mid, qid, cur, confirmDel:false, err:'' };
  renderEditor();
}
const edLines = v => String(v||'').split('\n').map(x => x.trim()).filter(Boolean);
function renderEditor(){
  let el = document.getElementById('qed');
  if (!ED){ if (el) el.remove(); document.body.classList.remove('edopen'); return; }
  if (!el){ el = document.createElement('div'); el.id = 'qed'; el.className = 'edov'; document.body.appendChild(el); el.addEventListener('click', edClick); }
  document.body.classList.add('edopen');
  const q = ED.cur, key = ED.mid + '::' + ED.qid, edited = !!P.edits[key];
  const ta = (id, label, val, rows, hint) => `<label class="edl">${label}${hint ? `<small>${hint}</small>` : ''}<textarea id="${id}" rows="${rows}">${esc(val)}</textarea></label>`;
  let body = '';
  if (Array.isArray(q.options) && Array.isArray(q.answers)){
    const opts = q.options.concat(['', '']);
    body = ta('edPrompt', 'Frage', q.prompt || '', 3) +
      `<div class="edl">Antworten<small>Haken = richtig. Leere Zeilen werden ignoriert.${q.exam ? ' Das ist eine Originalfrage – am besten nur Fehler korrigieren.' : ''}</small>
        ${opts.map((o, i) => `<div class="edrow"><input type="checkbox" class="edok" ${q.answers.includes(i) ? 'checked' : ''}><input class="edopt" value="${esc(o)}" placeholder="Antwort ${i+1}"></div>`).join('')}</div>` +
      ta('edExpl', 'Erklärung', q.explain || '', 3);
  } else if (q.gen){
    body = `<p class="edinfo">🎲 Diese Aufgabe wird jedes Mal mit neuen Zufallszahlen erzeugt. Du kannst sie nur löschen.</p>`;
  } else {
    body = ta('edPrompts', 'Frage', (q.prompts||[]).join('\n'), 3, 'Mehrere Zeilen = verschiedene Formulierungen derselben Frage, die App wählt zufällig eine.') +
      ta('edCorrect', 'Richtige Antwort(en)', (q.correct||[]).join('\n'), 3, 'Eine pro Zeile – die App zeigt jeweils eine davon.') +
      ta('edWrong', 'Falsche Antworten', (q.wrong||[]).join('\n'), 5, 'Eine pro Zeile, mindestens 3 – die App wählt jeweils 3 aus.') +
      ta('edExpl', 'Erklärung', q.explain || '', 3);
  }
  el.innerHTML = `<div class="edcard">
    <div class="edtop"><h2>✏️ Frage bearbeiten</h2><button class="gx" data-ed="close">✕</button></div>
    ${body}
    ${ED.err ? `<div class="ederr">${esc(ED.err)}</div>` : ''}
    <div class="btnrow" style="margin-top:16px">${q.gen ? '' : '<button class="btn acc" data-ed="save">Speichern</button>'}<button class="btn ghost" data-ed="close">Abbrechen</button></div>
    <div class="edfoot">
      ${edited && !P.edits[key].del ? '<button class="btn ghost" data-ed="reset">↩️ Original wiederherstellen</button>' : ''}
      <button class="btn danger" data-ed="del">${ED.confirmDel ? '🗑️ Wirklich löschen?' : '🗑️ Frage löschen'}</button>
    </div>
  </div>`;
}
function edCommit(entry, msg){
  const key = ED.mid + '::' + ED.qid;
  if (entry) P.edits[key] = Object.assign({ t: Date.now() }, entry); else delete P.edits[key];
  save(); S.modules = applyEdits(S.raw);
  // noch nicht beantwortete Frage auf dem Bildschirm sofort mit der neuen Fassung anzeigen
  const m = S.modules.find(x => x.id === ED.mid), nq = m && (m.questions||[]).find(q => q.id === ED.qid);
  const live = [...((S.test && S.test.items) || []), ...(S.lq || [])].filter(it => it.qid === ED.qid && it.ok === undefined);
  if (nq) live.forEach(it => { it.b = buildQ(nq, m); it.sel = []; it.chosen = null; });
  ED = null; renderEditor(); toast(msg);
  if (live.length || ['settings','module','stack','wb'].includes(S.view)) render();
}
function edClick(ev){
  const b = ev.target.closest('[data-ed]');
  if (!b){ if (ev.target.id === 'qed'){ ED = null; renderEditor(); } return; }
  const act = b.dataset.ed, q = ED.cur, val = id => (document.getElementById(id) || {}).value || '';
  if (act === 'close'){ ED = null; renderEditor(); return; }
  if (act === 'reset'){ edCommit(null, '<span class="c">↩️</span> Original wiederhergestellt'); return; }
  if (act === 'del'){
    if (!ED.confirmDel){ ED.confirmDel = true; renderEditor(); return; }
    edCommit({ del:true }, '<span class="c">🗑️</span> Frage gelöscht'); return;
  }
  if (act === 'save'){
    let nq;
    if (Array.isArray(q.options) && Array.isArray(q.answers)){
      const rows = [...document.querySelectorAll('#qed .edrow')].map(r => ({ t: r.querySelector('.edopt').value.trim(), ok: r.querySelector('.edok').checked })).filter(r => r.t);
      const prompt = val('edPrompt').trim();
      if (!prompt) ED.err = 'Bitte einen Fragetext eingeben.';
      else if (rows.length < 2) ED.err = 'Mindestens 2 Antworten nötig.';
      else if (!rows.some(r => r.ok)) ED.err = 'Mindestens eine Antwort als richtig ankreuzen.';
      else { const answers = rows.map((r,i) => r.ok ? i : -1).filter(i => i >= 0); nq = { prompt, options: rows.map(r => r.t), answers, multi: answers.length > 1 || !!q.multi, explain: val('edExpl').trim() }; }
    } else {
      const prompts = edLines(val('edPrompts')), correct = edLines(val('edCorrect')), wrong = edLines(val('edWrong'));
      if (!prompts.length) ED.err = 'Bitte einen Fragetext eingeben.';
      else if (!correct.length) ED.err = 'Mindestens eine richtige Antwort nötig.';
      else if (wrong.length < 3) ED.err = 'Mindestens 3 falsche Antworten nötig.';
      else if (correct.some(c => wrong.includes(c))) ED.err = 'Eine Antwort steht gleichzeitig bei richtig und falsch.';
      else { nq = { prompts, correct, wrong, explain: val('edExpl').trim() }; if (correct.length < 3) nq.notPrompts = []; }
    }
    if (!nq){ renderEditor(); return; }
    edCommit({ q: nq }, '<span class="c">✏️</span> Gespeichert – gilt ab der nächsten Abfrage');
  }
}

// Rote Scroll-Anzeige rechts (statt der grauen)
(() => {
  const bar = document.createElement('div'); bar.id = 'rscroll'; document.body.appendChild(bar); let tm = 0;
  addEventListener('scroll', () => {
    const doc = document.documentElement, total = doc.scrollHeight, vh = innerHeight;
    if (total <= vh + 2){ bar.classList.remove('on'); return; }
    const pad = 6, h = Math.max(40, (vh - 2*pad) * vh / total), top = pad + (vh - 2*pad - h) * (scrollY / (total - vh));
    bar.style.height = h + 'px'; bar.style.transform = 'translateY(' + Math.max(pad, Math.min(vh - pad - h, top)) + 'px)';
    bar.classList.add('on'); clearTimeout(tm); tm = setTimeout(() => bar.classList.remove('on'), 700);
  }, { passive:true });
})();
function go(view){ document.documentElement.classList.remove('gmopen'); S.view = view; S.confirmQuit = false; render(); window.scrollTo(0,0); }

/* ---------- actions ---------- */
function pickAnswer(it, j, m){
  if (it.ok !== undefined) return;
  if (it.b.multi){ it.sel = it.sel || []; const k = it.sel.indexOf(j); if (k >= 0) it.sel.splice(k, 1); else it.sel.push(j); render(); return; }
  finishAnswer(it, j, m);
}
function finishAnswer(it, chosen, m){
  if (it.ok !== undefined) return;
  if (Array.isArray(chosen)){
    if (!chosen.length) return;
    const a = it.b.answers.slice().sort().join(','), c = chosen.slice().sort().join(',');
    it.ok = a === c;
  } else it.ok = it.b.answers.includes(chosen);
  it.chosen = chosen;
  const q = m && (m.questions||[]).find(x => x.id===it.qid);
  if (q) record(m, q, it.ok);
  if (it.onDone) it.onDone(it);
  render();
}
let examClock = null;
function fmtMs(ms){ const s = Math.max(0, Math.round(ms/1000)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
function startExamClock(){
  clearInterval(examClock);
  if (!S.test || !S.test.limit) return;
  const tick = () => {
    const T = S.test, el = document.getElementById('examclock');
    if (!T || !T.limit || S.view !== 'test'){ clearInterval(examClock); return; }
    if (!el) return;
    const left = T.limit - (Date.now() - T.t0);
    if (left <= 0 && !T.timeUp){ T.timeUp = true; }
    el.textContent = left > 0 ? '⏱ ' + fmtMs(left) : '⏱ Zeit um';
    el.classList.toggle('late', left <= 0);
    el.classList.toggle('warn', left > 0 && left < 60000);
  };
  tick(); examClock = setInterval(tick, 1000);
}
function startTest(mode){
  const m = mod();
  if (!m) return;
  if (mode === 'mix' && stats(m).open){ A.testLocked(); return; }
  const exam = mode==='exam' || mode==='examWrong';
  const qs = selectQs(m, mode, exam ? 30 : mode === 'due' ? 20 : (mode === 'wrong' || mode === 'open') ? 100000 : 10); if (!qs.length) return;   // Übungsheft: ganzer Stapel
  S.test = { modId:m.id, mode, exam, items: qs.map(q => ({ qid:q.id, b:buildQ(q, m), chosen:null, sel:[] })), idx:0, saved:false, t0:Date.now(), limit: exam ? qs.length*60000 : 0 };
  go('test');
  startExamClock();
}

function distToPathP(path, x, y){
  let best = 1e9;
  for (let i = 0; i < path.length-1; i++){
    const [ax,ay] = path[i], [bx,by] = path[i+1], dx = bx-ax, dy = by-ay;
    const t = Math.max(0, Math.min(1, ((x-ax)*dx + (y-ay)*dy) / (dx*dx+dy*dy)));
    best = Math.min(best, Math.hypot(x-(ax+t*dx), y-(ay+t*dy)));
  }
  return best;
}
function seeded(s){ return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function prepMap(m){
  if (m.seg) return m;
  m.seg = m.path.slice(1).map((p,i) => Math.hypot(p[0]-m.path[i][0], p[1]-m.path[i][1]));
  m.len = m.seg.reduce((a,b) => a+b, 0);
  const nearCastle = (x,y,r) => Math.hypot(x-m.castle[0], y-m.castle[1]) < r;
  if (m.slotsRaw) m.slots = m.slotsRaw.filter(([x,y]) => distToPathP(m.path,x,y) >= 55);
  else {
    const c = [];
    for (let y = 50; y <= 595; y += 25) for (let x = 50; x <= 950; x += 25){ const d = distToPathP(m.path,x,y); if (d >= 60 && d <= 96 && !nearCastle(x,y,75)) c.push([x,y,d]); }
    c.sort((a,b) => a[2]-b[2] || a[0]-b[0] || a[1]-b[1]);
    const out = [];
    for (const p of c) if (out.every(q => Math.hypot(q[0]-p[0], q[1]-p[1]) >= 92)) out.push([p[0],p[1]]);
    m.slots = out;
  }
  const rnd = seeded(m.name.length * 977 + m.path.length), deco = [];
  for (let k = 0; k < 400 && deco.length < 24; k++){
    const x = 20 + rnd()*960, y = 20 + rnd()*600;
    if (distToPathP(m.path,x,y) < 62 || nearCastle(x,y,70) || m.slots.some(([sx,sy]) => Math.hypot(sx-x, sy-y) < 48) || deco.some(d => Math.hypot(d.x-x, d.y-y) < 55)) continue;
    deco.push({ x, y, e: m.deco[Math.floor(rnd()*m.deco.length)], s: 20 + rnd()*14, a: 0.35 + rnd()*0.3 });
  }
  m.decoPts = deco;
  return m;
}

    d -= MAP.seg[i];
  }
  return p[p.length-1];
}

function waveSpec(n){
  const list = [], theme = n >= 4 && n % 4 === 0 ? ['schwarm','kolonne','chaos'][(n/4 - 1) % 3] : null;
  const avail = ['normal','schnell','panzer','schild','heiler','teiler'].filter(t => (ENEMY[t].from||0) <= n);
  let count = 5 + 2*n;
  if (theme === 'schwarm') count = Math.round(count * 1.5);
  if (theme === 'kolonne') count = Math.round(count * 0.7);
  for (let i = 0; i < count; i++){
    let t = 'normal';
    if (theme === 'schwarm') t = i % 4 === 3 ? 'normal' : 'schnell';
    else if (theme === 'kolonne') t = i % 2 ? 'panzer' : (n >= 6 && i % 4 === 2 ? 'schild' : 'normal');
    else if (theme === 'chaos') t = avail[(i * 7 + n) % avail.length];
    else {
      if (n >= 3 && i % 3 === 2) t = 'schnell';
      if (n >= 5 && i % 5 === 4) t = 'panzer';
      if (n >= 6 && i % 7 === 3) t = 'schild';
      if (n >= 8 && i % 8 === 5) t = 'heiler';
      if (n >= 11 && i % 6 === 1) t = 'teiler';
    }
    list.push(t);
  }
  if (n >= 2){ const g = 1 + Math.floor((n - 2) / 5); for (let i = 0; i < g; i++) list.splice(Math.floor(list.length * (i + 1) / (g + 1)), 0, 'geist'); }
  if (n % 5 === 0) list.push(n % 10 === 0 ? 'boss' : 'koloss');
  return { list, theme };
}

}

function gamePickQuestion(G){
  const m = G.m, qs = (m.questions||[]).filter(q => !G.used.has(q.id));
  const pool = qs.length ? qs : (m.questions||[]);
  if (!qs.length) G.used.clear();
  const red = pool.filter(q => status(m,q) === 'w'), due = pool.filter(q => status(m,q) === 'r' && isDue(m,q));
  const r0 = Math.random();
  const q = (red.length && r0 < GCFG.repeatShare) ? rand(red) : (due.length && r0 < GCFG.repeatShare + 0.3) ? rand(due) : rand(pool);
  G.used.add(q.id);
  const e = P.q[key(m,q)] || { r:0, w:0 };
  const repeat = e.last === 'w' && (e.w||0) >= 2 && !P.game.bonus[key(m,q)];

    const base = GCFG.reward[it.level] || 20, mult = GCFG.mult(G.streak);
    let bonus = 0;
    if (it.repeat){ bonus = GCFG.repeatBonus; P.game.bonus[key(G.m, {id:it.qid})] = Date.now(); }
    const total = (base + bonus) * mult;
    G.coins += total; G.earned += total; G.right++;
    G.reward = { ok:true, base, bonus, mult, total };
    if (G.qKind === 'ghost' && G.ghost && !G.ghost.dead){ damage(G, G.ghost, 1e9, true, false, true); G.reward.ghost = 'tot'; }
  } else {

  MAP.slots.forEach(([x,y], i) => {
    const t = G.towers.find(t => t.slot === i);
    if (G.sel === i){ const r = t ? towerStats(t).range : 0; if (r){ ctx.fillStyle = 'rgba(255,200,61,.08)'; ctx.strokeStyle = 'rgba(255,200,61,.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); ctx.stroke(); } }
    if (!t){
      if (G.phase === 'wave' && G.sel !== i){ ctx.fillStyle = 'rgba(255,255,255,.025)'; ctx.beginPath(); ctx.arc(x,y,18,0,7); ctx.fill(); return; }
      const pulse = G.phase === 'build' ? 0.18 + 0.1 * Math.sin(ts/400 + i) : 0.15;
      ctx.strokeStyle = G.sel === i ? '#FFC83D' : 'rgba(255,255,255,' + pulse + ')'; ctx.lineWidth = 2; ctx.setLineDash([5,5]);
      ctx.beginPath(); ctx.arc(x,y,24,0,7); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(255,255,255,' + (pulse + 0.07) + ')'; ctx.font = 'bold 20px sans-serif'; ctx.fillText('+', x, y+1);
    } else {
      const b = TOWERS[t.type], k = 1 + 0.12 * Math.max(0, t.fireT || 0) / 0.14;
      ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.ellipse(x, y+22, 24, 8, 0, 0, 7); ctx.fill();
      const g = ctx.createRadialGradient(x-8, y-10, 4, x, y, 28); g.addColorStop(0, '#2C2C33'); g.addColorStop(1, '#17171B');
      ctx.fillStyle = g; ctx.strokeStyle = b.color; ctx.lineWidth = 3 + (t.level - 1);
      ctx.beginPath(); ctx.arc(x, y, 26*k, 0, 7); ctx.fill(); ctx.stroke();
      if (t.ang !== undefined){ ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(x + Math.cos(t.ang)*27*k, y + Math.sin(t.ang)*27*k, 4.5, 0, 7); ctx.fill(); }
      ctx.font = Math.round(24*k) + 'px serif'; ctx.fillText(b.icon, x, y+1);
      for (let l = 0; l < t.level; l++){ ctx.fillStyle = '#FFC83D'; ctx.beginPath(); ctx.arc(x-10+l*10, y+34, 3.5, 0, 7); ctx.fill(); }
    }
  });
  // Gegner (von hinten nach vorne)
  const es = G.enemies.slice().sort((a,b) => (ENEMY[a.t].ghost ? 1 : 0) - (ENEMY[b.t].ghost ? 1 : 0) || posAt(a.d)[1] - posAt(b.d)[1]);
  for (const e of es) drawEnemy(ctx, e, ts);
  // Geschosse
  for (const s of G.shots){
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.ang || 0);
    if (s.kind === 'pfeil'){ ctx.strokeStyle = '#E8C590'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(-12,0); ctx.lineTo(6,0); ctx.stroke(); ctx.fillStyle = '#E8E8E8'; ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(4,-4); ctx.lineTo(4,4); ctx.fill(); }
    else if (s.kind === 'kugel'){ ctx.fillStyle = '#2A2A2E'; ctx.strokeStyle = '#9AA0A6'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(0,0,7,0,7); ctx.fill(); ctx.stroke(); }
    else if (s.kind === 'eis'){ ctx.fillStyle = '#CFEAFF'; ctx.beginPath(); ctx.moveTo(9,0); ctx.lineTo(0,-5); ctx.lineTo(-7,0); ctx.lineTo(0,5); ctx.fill(); }
    else { ctx.shadowColor = s.color; ctx.shadowBlur = 14; ctx.fillStyle = s.color; ctx.beginPath(); ctx.arc(0,0,s.kind === 'orb' ? 7 : 5.5,0,7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-1,-1,2.2,0,7); ctx.fill(); }
    ctx.restore();
  }
  // Blitze
  for (const b of G.bolts){
    ctx.strokeStyle = '#FFE38A'; ctx.globalAlpha = Math.min(1, b.t * 7); ctx.lineWidth = 3; ctx.shadowColor = '#FFC83D'; ctx.shadowBlur = 16;
    ctx.beginPath();
    for (let i = 0; i < b.pts.length - 1; i++){
      const [ax,ay] = b.pts[i], [bx,by] = b.pts[i+1];
      if (!i) ctx.moveTo(ax, ay);
      for (let s = 1; s <= 5; s++){ const f = s/5, j = s < 5 ? 9 : 0; ctx.lineTo(ax + (bx-ax)*f + (Math.random()-.5)*j, ay + (by-ay)*f + (Math.random()-.5)*j); }
    }
    ctx.stroke(); ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;
  for (const f of G.fx){
    if (f.k === 'boom'){ ctx.strokeStyle = f.color; ctx.globalAlpha = f.t/0.3; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1.25 - f.t), 0, 7); ctx.stroke();
      ctx.fillStyle = f.color; ctx.globalAlpha = f.t/0.3 * 0.18; ctx.fill(); }
    if (f.k === 'ring'){ ctx.strokeStyle = f.color; ctx.globalAlpha = f.t/0.5 * 0.7; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1 - f.t), 0, 7); ctx.stroke(); }
  }
  ctx.globalAlpha = 1;
  // Partikel & Punkte
  for (const p of G.parts){ ctx.globalAlpha = Math.min(1, p.t * 2.5); ctx.fillStyle = p.c; ctx.fillRect(p.x - p.s/2, p.y - p.s/2, p.s, p.s); }
  ctx.globalAlpha = 1;
  for (const f of G.floats){ ctx.globalAlpha = Math.min(1, f.t * 2); ctx.font = (f.big ? 'bold 26px' : 'bold 15px') + ' sans-serif'; ctx.fillStyle = '#FFC83D'; ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.lineWidth = 3; ctx.strokeText(f.txt, f.x, f.y); ctx.fillText(f.txt, f.x, f.y); }
  ctx.globalAlpha = 1;
  // Burg mit Lebensanzeige
  const [cx,cy] = MAP.castle, cs = 1 + (G.shake > 0 ? 0.08 : 0);
  ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.ellipse(cx, cy+24, 30, 9, 0, 0, 7); ctx.fill();
  ctx.font = Math.round(48*cs) + 'px serif'; ctx.fillText('🏰', cx, cy);
  const lf = Math.max(0, G.lives / GCFG.lives), lw = 56, lx = Math.min(GW - lw - 6, cx - lw/2), ly = cy + 34;
  ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(lx-1, ly-1, lw+2, 8);
  ctx.fillStyle = lf > 0.5 ? '#2FBF71' : lf > 0.25 ? '#FFC83D' : '#FF4545'; ctx.fillRect(lx, ly, lw*lf, 6);
  // Boss-Leiste
  const boss = G.enemies.find(e => ENEMY[e.t].boss);
  if (boss){
    const d = ENEMY[boss.t], w = 420, bx = GW/2 - w/2, by = 16;
    ctx.fillStyle = 'rgba(0,0,0,.72)'; ctx.fillRect(bx-6, by-6, w+12, 30);
    ctx.fillStyle = '#3A0C0C'; ctx.fillRect(bx, by+10, w, 10);
    ctx.fillStyle = '#FF2A1F'; ctx.fillRect(bx, by+10, w * Math.max(0, boss.hp/boss.max), 10);
    if (boss.sh > 0){ ctx.fillStyle = '#8CB4FF'; ctx.fillRect(bx, by+10, w * boss.sh/boss.shMax, 4); }
    ctx.font = 'bold 12px sans-serif'; ctx.fillStyle = '#fff'; ctx.fillText(d.icon + ' ' + d.name.toUpperCase(), GW/2, by + 2);
  }
  ctx.restore();
  // Treffer-Blitz
  for (const f of G.fx) if (f.k === 'hit'){ ctx.fillStyle = 'rgba(225,6,0,' + (f.t*0.45) + ')'; ctx.fillRect(0,0,GW,GH); }
  // Banner
  if (G.banner && !G.q){
    const b = G.banner, a = Math.min(1, b.t * 2, (2.2 - b.t) * 5), y = GH * 0.42;
    ctx.globalAlpha = a; ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, y - 44, GW, b.sub ? 92 : 70);
    ctx.font = 'bold 38px sans-serif'; ctx.fillStyle = b.color; ctx.fillText(b.txt, GW/2, y - 8);
    if (b.sub){ ctx.font = 'bold 18px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillText(b.sub, GW/2, y + 28); }
    ctx.globalAlpha = 1;
  }
}

function gameTap(ev){

    for (const e of G.enemies){ if (e.dead || !ENEMY[e.t].ghost) continue; const [ex,ey] = posAt(e.d), dd = Math.hypot(ex-x, ey-6-y); if (dd < bd){ bd = dd; best = e; } }
    if (best){ G.ghost = best; best.caught = true; gameAsk(G, 'ghost'); }

  }

/* ---------- kleines Markdown + Python-Färbung ---------- */
const PY_KW = new Set('def return if elif else for in while import from as and or not True False None'.split(' '));
const PY_FN = new Set('print len range input int float str type sum chr list'.split(' '));
function hl(src){
  let out = '', i = 0; const s = String(src);
  const re = /(#[^\n]*)|([fF]?"(?:[^"\\\n]|\\.)*"?|[fF]?'(?:[^'\\\n]|\\.)*'?)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)|([\s\S])/g; let mm;
  while ((mm = re.exec(s))){
    if (mm[1]) out += `<span class="hc">${esc(mm[1])}</span>`;
    else if (mm[2]) out += `<span class="hs">${esc(mm[2])}</span>`;
    else if (mm[3]) out += `<span class="hn">${esc(mm[3])}</span>`;
    else if (mm[4]) out += PY_KW.has(mm[4]) ? `<span class="hk">${mm[4]}</span>` : PY_FN.has(mm[4]) ? `<span class="hf">${mm[4]}</span>` : mm[4];
    else out += esc(mm[5]);
  }
  return out;
}
function mdInline(t){
  return esc(t).replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\*([^*\s][^*]*)\*/g, '<i>$1</i>');
}
function md(src){
  const lines = String(src || '').trim().split('\n'); let out = '', list = null, para = [];
  const flushP = () => { if (para.length){ out += `<p>${mdInline(para.join(' '))}</p>`; para = []; } };
  const flushL = () => { if (list){ out += `</${list}>`; list = null; } };
  for (let i = 0; i < lines.length; i++){
    const ln = lines[i];
    if (/^```/.test(ln.trim())){ flushP(); flushL(); const buf = []; i++; while (i < lines.length && !/^```/.test(lines[i].trim())) buf.push(lines[i++]); out += `<pre class="cwpre">${hl(buf.join('\n'))}</pre>`; continue; }
    const li = ln.match(/^\s*(?:- |(\d+)\. )(.*)$/);
    if (li){ flushP(); const tag = li[1] ? 'ol' : 'ul'; if (list !== tag){ flushL(); out += `<${tag}>`; list = tag; } out += `<li>${mdInline(li[2])}</li>`; continue; }
    if (!ln.trim()){ flushP(); flushL(); continue; }
    flushL(); para.push(ln.trim());
  }
  flushP(); flushL(); return out;
}

/* ---------- Python (Pyodide im Hintergrund-Worker) ---------- */
const PY = { w:null, seq:0, wait:{}, state:'idle', msg:'', timer:0, pk:new Set() };
function pyWorker(){
  if (PY.w) return PY.w;
  PY.w = new Worker('py-worker.js');
  PY.w.onmessage = e => {
    const d = e.data, cb = PY.wait[d.id]; if (!cb) return;
    if (d.phase === 'boot'){ PY.state = 'loading'; PY.msg = 'Python wird geladen … (beim ersten Mal ca. 10–30 Sekunden)'; pyStatus(); }
    else if (d.phase === 'pkg'){ PY.state = 'loading'; PY.msg = 'Lade ' + d.pkgs.join(', ') + ' …'; pyStatus(); }
    else if (d.phase === 'run'){ PY.state = 'ready'; PY.msg = 'läuft …'; pyStatus(); clearTimeout(PY.timer); PY.timer = setTimeout(() => pyKill(d.id), 10000); }
    else if (d.phase === 'done'){ clearTimeout(PY.timer); PY.state = 'ready'; PY.msg = ''; (cb.pk||[]).forEach(p => PY.pk.add(p)); delete PY.wait[d.id]; cb.ok(d.res); pyStatus(); }
    else if (d.phase === 'fail'){ clearTimeout(PY.timer); PY.state = 'fail'; PY.msg = d.msg; delete PY.wait[d.id]; cb.ok({ fail: d.msg }); pyStatus(); }
  };
  PY.w.onerror = ev => { PY.state = 'fail'; PY.msg = 'Python konnte nicht starten'; Object.values(PY.wait).forEach(cb => cb.ok({ fail: PY.msg })); PY.wait = {}; PY.w = null; pyStatus(); ev.preventDefault && ev.preventDefault(); };
  return PY.w;
}
function pyKill(id){
  const cb = PY.wait[id]; try { PY.w.terminate(); } catch(e){} PY.w = null; PY.pk = new Set(); PY.state = 'idle'; delete PY.wait[id];
  if (cb) cb.ok({ out:'', err:{ type:'Timeout', msg:'', line:null }, check:null });
}
function pyCall(req, pkgs, warm){
  return new Promise(ok => { const id = ++PY.seq; PY.wait[id] = { ok, pk:pkgs }; pyWorker().postMessage({ id, req, pkgs: pkgs||[], warm: !!warm, base: cwMod().coding.pyodide }); });
}
function pyStatus(){ const el = document.getElementById('pystat'); if (el) el.innerHTML = pyStatHtml(); }
function pyStatHtml(){
  if (PY.state === 'loading') return `<span class="pydot load"></span>${esc(PY.msg)}`;
  if (PY.state === 'fail') return `<span class="pydot bad"></span>Python konnte nicht geladen werden – beim ersten Mal braucht es Internet. <button class="linkbtn" data-act="cwPyRetry">Nochmal versuchen</button>`;
  if (PY.state === 'ready') return `<span class="pydot ok"></span>Python bereit${PY.msg ? ' · ' + esc(PY.msg) : ''}`;
  return `<span class="pydot"></span>Python startet beim ersten Code-Level (einmal Internet nötig, danach offline)`;
}

/* ---------- Fehlermeldungen auf Deutsch ---------- */
function cwErr(e, code){
  if (!e) return null;
  const m = e.msg || '', t = e.type, L = e.line ? `Zeile ${e.line}: ` : '';
  const srcLine = e.line ? String(code).split('\n')[e.line-1] : '';
  let title = t, text = '';
  if (t === 'Timeout'){ title = '⏳ Dein Code läuft zu lange'; text = 'Nach 10 Sekunden abgebrochen – vermutlich eine Endlosschleife (z. B. while-Bedingung wird nie False).'; }
  else if (t === 'NameError'){ const n = (m.match(/'([^']+)'/)||[])[1] || '?'; title = `Python kennt <code>${esc(n)}</code> noch nicht`;
    const ids = [...new Set(String(code).match(/[A-Za-z_]\w*/g) || [])], twin = ids.find(x => x !== n && x.toLowerCase() === n.toLowerCase());
    text = twin ? `Meintest du <code>${esc(twin)}</code>? Python unterscheidet Groß- und Kleinschreibung.` : 'Tippfehler? Fehlende Anführungszeichen bei einem Text? Oder wird die Variable erst später angelegt (z. B. fehlt <code>total = 0</code> vor der Schleife)?'; }
  else if (t === 'SyntaxError' && /unterminated string/.test(m)){ title = 'Ein Text ist nicht geschlossen'; text = 'Es fehlt ein Anführungszeichen – jeder Text braucht eins am Anfang und eins am Ende.'; }
  else if (t === 'SyntaxError' && /never closed/.test(m)){ title = 'Eine Klammer ist nicht geschlossen'; text = 'Zu jeder ( [ { gehört eine ) ] } .'; }
  else if (t === 'SyntaxError' && /invalid decimal literal/.test(m)){ title = 'Zahl und Zeichen vermischt'; text = 'Eine Zahl darf keine Einheit oder Buchstaben enthalten (z. B. <code>9€</code> → <code>9</code>). Kommazahlen mit Punkt.'; }
  else if (t === 'SyntaxError' && /expected ':'/.test(m)){ title = 'Doppelpunkt fehlt'; text = 'Nach <code>if</code>, <code>elif</code>, <code>else</code>, <code>for</code>, <code>while</code> und <code>def</code> kommt ein <code>:</code>.'; }
  else if (t === 'SyntaxError' && /Maybe you meant '=='|cannot assign/.test(m)){ title = '= statt =='; text = 'Zum Vergleichen braucht man <code>==</code>. Ein einzelnes <code>=</code> weist einen Wert zu.'; }
  else if (t === 'SyntaxError'){ title = 'Python versteht diese Zeile nicht'; text = 'Prüfe Schreibweise, Klammern, Anführungszeichen und Doppelpunkte. Befehle heißen genau so wie im Seminar (z. B. <code>right(90)</code>, nicht <code>turn right(90)</code>).'; }
  else if (t === 'IndentationError' && /expected an indented/.test(m)){ title = 'Einrückung fehlt'; text = 'Nach einer Zeile mit <code>:</code> muss der zugehörige Code eingerückt sein (4 Leerzeichen – Taste ⇥).'; }
  else if (t === 'IndentationError'){ title = 'Einrückung passt nicht'; text = 'Diese Zeile ist eingerückt, obwohl sie es nicht sein darf – oder unterschiedlich weit.'; }
  else if (t === 'TypeError' && /concatenate str|unsupported operand.*'str'|'str' and 'int'|'int' and 'str'/.test(m)){ title = 'Text und Zahl gemischt'; text = 'Text (str) und Zahl kann man nicht mit + verbinden. Erst umwandeln: <code>int(...)</code> oder <code>float(...)</code>.'; }
  else if (t === 'TypeError' && /NoneType/.test(m)){ title = 'Mit None gerechnet'; text = 'Ein Wert ist <code>None</code> – meistens fehlt in einer Funktion das <code>return</code> (print zeigt nur an).'; }
  else if (t === 'TypeError' && /can't multiply sequence/.test(m)){ title = 'Text mal Text?'; text = 'Zwei Texte kann man nicht multiplizieren.'; }
  else if (t === 'TypeError'){ title = 'Falscher Datentyp'; text = 'Hier passt der Datentyp nicht zur Operation.'; }
  else if (t === 'ValueError' && /invalid literal for int|could not convert/.test(m)){ title = 'Umwandeln geht nicht'; text = 'Der Text besteht nicht nur aus Ziffern und lässt sich deshalb nicht in eine Zahl umwandeln.'; }
  else if (t === 'IndexError'){ title = 'Diesen Index gibt es nicht'; text = 'Gezählt wird ab 0 – bei 7 Einträgen ist der letzte Index 6.'; }
  else if (t === 'KeyError'){ title = 'Diese Spalte gibt es nicht'; text = `Gesucht wurde ${esc(m)} – Schreibweise prüfen (Groß/klein, Anführungszeichen).`; }
  else if (t === 'ZeroDivisionError'){ title = 'Durch 0 geteilt'; text = 'Teilen durch 0 geht nicht.'; }
  else if (t === 'AttributeError'){ title = 'Das gibt es hier nicht'; text = esc(m); }
  else if (t === 'RuntimeError'){ title = 'Fehler'; text = esc(m); }
  else text = esc(m);
  return `<div class="cwerr"><b>${L}${title}</b><p>${text}</p>${srcLine ? `<pre class="cwpre">${hl(srcLine)}</pre>` : ''}<small>${esc(t)}${m && t !== 'Timeout' ? ': ' + esc(m) : ''}</small></div>`;
}

/* ---------- Turtle: zeichnen & vergleichen ---------- */
function cwMerge(segs){
  let s = segs.map(x => x.slice(0, 4)).filter(x => Math.hypot(x[2]-x[0], x[3]-x[1]) > 0.5), changed = true;
  while (changed){ changed = false;
    outer: for (let i = 0; i < s.length; i++) for (let j = i + 1; j < s.length; j++){
      const a = s[i], b = s[j], pts = [[a[0],a[1]],[a[2],a[3]],[b[0],b[1]],[b[2],b[3]]];
      const cross = (p, q, r) => (q[0]-p[0])*(r[1]-p[1]) - (q[1]-p[1])*(r[0]-p[0]);
      const len = Math.hypot(a[2]-a[0], a[3]-a[1]);
      if (Math.abs(cross(pts[0], pts[1], pts[2])) / len > 0.6 || Math.abs(cross(pts[0], pts[1], pts[3])) / len > 0.6) continue;
      const dx = (a[2]-a[0]) / len, dy = (a[3]-a[1]) / len, pr = p => (p[0]-a[0])*dx + (p[1]-a[1])*dy;
      const ta = [0, len], tb = [pr(pts[2]), pr(pts[3])].sort((x, y) => x - y);
      if (tb[0] > ta[1] + 0.6 || tb[1] < ta[0] - 0.6) continue;
      const lo = Math.min(0, tb[0]), hi = Math.max(len, tb[1]);
      s[i] = [a[0] + dx*lo, a[1] + dy*lo, a[0] + dx*hi, a[1] + dy*hi]; s.splice(j, 1); changed = true; break outer;
    }
  }
  return s;
}

function cwInputs(code, dflt){

    <div class="cwresbox ${ok ? 'ok' : ''}"><div class="cwbig">${ok ? '🏆' : '💪'}</div><h1>${R.p} %</h1><p>${R.r} von ${R.n} richtig · ${esc(ch.title)}</p>
    <p>${ok ? (nx ? `Bestanden! <b>${esc(nx.title)}</b> ist jetzt freigeschaltet.` : 'Bestanden – du hast alles geschafft, was bisher dran war!') : 'Ab 80 % geht es weiter. Schau dir die Level mit wenig Sternen nochmal an und versuch es dann erneut.'}</p>
    <div class="btnrow" style="justify-content:center">${ok ? `<button class="btn acc" data-act="cw">Weiter zur Karte</button>` : `<button class="btn acc" data-act="cwTest" data-c="${ch.id}">Nochmal versuchen</button><button class="btn ghost" data-act="cw">Zur Karte</button>`}</div></div></div>`;
}

/* Eingaben ohne Neuzeichnen merken */
app.addEventListener('input', e => {
  const el = e.target, st = S.cwl; if (!st || !el.dataset || !el.dataset.in) return;
  if (el.dataset.in === 'gap'){ st.gapv[+el.dataset.k] = el.value; el.classList.remove('bad'); }
  else if (el.dataset.in === 'calc'){ st.calcv = el.value; el.classList.remove('bad'); }
  else if (el.dataset.in === 'code'){ st.code = el.value; P.cw.code[st.lid] = el.value; clearTimeout(cwSaveT); cwSaveT = setTimeout(save, 800); el.rows = Math.max(6, el.value.split('\n').length + 1); }
});
let cwSaveT = 0;
function cwInsert(ta, text, back){
  const a = ta.selectionStart, b = ta.selectionEnd; ta.value = ta.value.slice(0, a) + text + ta.value.slice(b);
  const pos = a + text.length - (back || 0); ta.selectionStart = ta.selectionEnd = pos; ta.dispatchEvent(new Event('input', { bubbles:true }));
}
app.addEventListener('keydown', e => {
  const ta = e.target; if (ta.id !== 'cwta') return;
  if (e.key === 'Tab'){ e.preventDefault(); cwInsert(ta, '    '); }
  else if (e.key === 'Enter'){ e.preventDefault(); const before = ta.value.slice(0, ta.selectionStart), ln = before.split('\n').pop(); let ind = (ln.match(/^ */) || [''])[0]; if (/:\s*$/.test(ln)) ind += '    '; cwInsert(ta, '\n' + ind); }
});
app.addEventListener('pointerdown', e => {
  const k = e.target.closest('.cwkey'); if (!k) return; e.preventDefault();
  const ta = document.getElementById('cwta'); if (!ta || ta.readOnly) return; const key = k.dataset.key;
  if (key === 'reset'){ if (!confirm('Deinen Code auf den Anfang zurücksetzen?')) return; const st = S.cwl, lv = cwLv(cwCh(st.ch), st.lid); ta.value = lv.starter; ta.dispatchEvent(new Event('input', { bubbles:true })); return; }
  ta.focus();
  if (key === '⇥') return cwInsert(ta, '    ');
  if (key === '⇤'){ const a = ta.selectionStart, s0 = ta.value.lastIndexOf('\n', a - 1) + 1, n = (ta.value.slice(s0).match(/^ {1,4}/) || [''])[0].length; if (!n) return;
    ta.value = ta.value.slice(0, s0) + ta.value.slice(s0 + n); ta.selectionStart = ta.selectionEnd = Math.max(s0, a - n); ta.dispatchEvent(new Event('input', { bubbles:true })); return; }
  if (key === '( )') return cwInsert(ta, '()', 1);
  if (key === '[ ]') return cwInsert(ta, '[]', 1);
  if (key === '" "') return cwInsert(ta, '""', 1);
  cwInsert(ta, key === '==' || key === '=' || key === '+' || key === '*' ? ' ' + key + ' ' : key);
});

app.addEventListener('change', e => {
  if (e.target.id !== 'restore' || !e.target.files[0]) return;
  const fr = new FileReader();
  fr.onload = () => {
    try { const data = JSON.parse(fr.result); if (!data || typeof data.q !== 'object') throw 0;
      P = mergeP(normP(data), P); save(); S.modules = applyEdits(S.raw); S.toast = '<span class="c">✅</span> Backup geladen!'; render();
    } catch(err){ S.toast = '<span class="c">⚠️</span> Datei ist kein Backup'; render(); }
  };
  fr.readAsText(e.target.files[0]);
});
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = A[el.dataset.act]; if (f) f(el.dataset);
});

/* ---------- confetti ---------- */
function confetti(){
  const c = document.getElementById('confetti'), x = c.getContext('2d');
  c.width = innerWidth*devicePixelRatio; c.height = innerHeight*devicePixelRatio; x.scale(devicePixelRatio, devicePixelRatio);
  const cols = ['#E10600','#FFFFFF','#FF4545','#7A0000','#2FBF71'];
  const ps = Array.from({length:140}, () => ({ x:innerWidth/2 + (Math.random()-.5)*200, y:innerHeight*0.35, vx:(Math.random()-.5)*14, vy:-Math.random()*14-4, s:6+Math.random()*7, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:rand(cols) }));
  const t0 = performance.now();
  (function frame(t){
    x.clearRect(0,0,innerWidth,innerHeight);
    ps.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); x.restore(); });
    if (t - t0 < 3200) requestAnimationFrame(frame); else x.clearRect(0,0,innerWidth,innerHeight);
  })(t0);
}

render();
init();
})();
</script>
